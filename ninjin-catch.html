<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>バニーおじさんの人参キャッチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#27325E; --deep:#1B2247; --carrot:#E8792E; --carrot-dark:#A9521C;
  --pink:#F4A7B9; --sky:#A8D8EF; --cream:#FFF3DC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --night:#222B54; --deep:#161C3C; }
}
:root[data-theme="dark"]{ --night:#222B54; --deep:#161C3C; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
html,body{ height:100%; margin:0; }
*,*::before,*::after{ box-sizing:inherit; }
body{
  background:var(--deep); color:var(--cream);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  display:flex; justify-content:center; overflow:hidden;
  -webkit-user-select:none; user-select:none; touch-action:none;
}
.app{ width:100%; max-width:480px; height:100%; display:flex; flex-direction:column; }
.hud{ display:flex; justify-content:space-between; align-items:baseline; padding:10px 18px 8px; font-weight:800; }
.hud b{ font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif; font-weight:400; font-size:1.6rem; color:var(--carrot); margin-left:6px; }
.hud .time b{ color:var(--sky); }
.stage{ flex:1; position:relative; min-height:0; }
canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; background:var(--night); border-radius:20px 20px 0 0; }
.status{ position:absolute; top:14px; left:0; right:0; text-align:center; font-weight:800; font-size:1.05rem; color:var(--pink); pointer-events:none; }
.overlay{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:24px; background:rgba(22,28,60,.86); border-radius:20px 20px 0 0;
}
.overlay[hidden]{ display:none; }
h1{ font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif; font-weight:400; font-size:clamp(1.6rem,7vw,2.1rem); line-height:1.3; margin:0 0 18px; }
.rules{ list-style:none; padding:0; margin:0 0 24px; font-size:.98rem; line-height:1.95; text-align:left; }
.rules span{ display:inline-block; width:1.7em; }
button{
  font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif; font-size:1.2rem; color:var(--deep);
  background:var(--carrot); border:0; border-radius:999px; padding:14px 36px; cursor:pointer;
  box-shadow:0 5px 0 var(--carrot-dark);
}
button:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--carrot-dark); }
button:focus-visible{ outline:3px solid var(--sky); outline-offset:4px; }
.big{ font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif; font-size:3.6rem; color:var(--carrot); margin:0; line-height:1.1; }
.rank{ font-size:1.15rem; font-weight:800; margin:8px 0 4px; color:var(--pink); }
.best{ font-size:.9rem; opacity:.8; margin:0 0 22px; }
.hint{ padding:8px 16px 10px; font-size:.8rem; opacity:.7; text-align:center; }
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div>人参<b id="score">0</b></div>
    <div class="time">のこり<b id="time">30</b></div>
  </div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="status" id="status"></div>
    <div class="overlay" id="start">
      <h1>バニーおじさんの<br>人参キャッチ</h1>
      <ul class="rules">
        <li><span>🥕</span>人参をトレイで受けると 1点</li>
        <li><span>🍸</span>人参カクテルは 5点</li>
        <li><span>🌀</span>愛の渦に当たると、左右があべこべ</li>
        <li><span>🪤</span>ほいほいに当たると、しばらく動けない</li>
      </ul>
      <button id="startBtn">はじめる</button>
    </div>
    <div class="overlay" id="end" hidden>
      <p class="big" id="final">0</p>
      <p class="rank" id="rank"></p>
      <p class="best" id="best"></p>
      <button id="againBtn">もう一回</button>
    </div>
  </div>
  <div class="hint">指でなぞるか、左右キーでおじさんを動かす</div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const statusEl = document.getElementById('status');
  const startOv = document.getElementById('start');
  const endOv = document.getElementById('end');

  const GAME_TIME = 30;
  let W = 0, H = 0, dpr = 1;
  let running = false, last = 0, elapsed = 0, spawnTimer = 0;
  let score = 0, items = [], pops = [];
  let dizzyUntil = 0, stuckUntil = 0, statusUntil = 0;
  const player = { x: 0, target: 0 };
  const keys = { left: false, right: false };
  const stars = Array.from({ length: 40 }, () => ({ x: Math.random(), y: Math.random() * 0.7, r: Math.random() * 1.4 + 0.4 }));

  const TYPES = [
    { e: '🥕', w: 0.62, kind: 'carrot' },
    { e: '🍸', w: 0.08, kind: 'cocktail' },
    { e: '🌀', w: 0.15, kind: 'swirl' },
    { e: '🪤', w: 0.15, kind: 'trap' }
  ];

  function resize() {
    const r = stage.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (!player.x) { player.x = player.target = W / 2; }
    player.x = Math.min(Math.max(player.x, 40), W - 40);
    if (!running) draw(0);
  }
  window.addEventListener('resize', resize);

  function readBest() {
    try { return Number(localStorage.getItem('ninjin-best')) || 0; } catch (e) { return 0; }
  }
  function saveBest(v) {
    try { localStorage.setItem('ninjin-best', String(v)); } catch (e) {}
  }

  function pickType() {
    let r = Math.random();
    for (const t of TYPES) { if ((r -= t.w) <= 0) return t; }
    return TYPES[0];
  }

  function setStatus(text, sec) {
    statusEl.textContent = text;
    statusUntil = elapsed + sec;
  }

  function pointerX(ev) {
    const r = stage.getBoundingClientRect();
    return ev.clientX - r.left;
  }
  function onPointer(ev) {
    if (!running) return;
    let x = pointerX(ev);
    if (elapsed < dizzyUntil) x = W - x;
    player.target = x;
  }
  stage.addEventListener('pointerdown', onPointer);
  stage.addEventListener('pointermove', onPointer);

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft') keys.left = true;
    if (e.key === 'ArrowRight') keys.right = true;
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
  });

  function start() {
    score = 0; items = []; pops = []; elapsed = 0; spawnTimer = 0;
    dizzyUntil = 0; stuckUntil = 0; statusUntil = 0; statusEl.textContent = '';
    player.x = player.target = W / 2;
    scoreEl.textContent = '0'; timeEl.textContent = String(GAME_TIME);
    startOv.hidden = true; endOv.hidden = true;
    running = true; last = performance.now();
    requestAnimationFrame(loop);
  }

  function finish() {
    running = false;
    statusEl.textContent = '';
    const best = Math.max(readBest(), score);
    saveBest(best);
    let rank;
    if (score < 10) rank = '卵おじさん（まだ修行中）';
    else if (score < 25) rank = '見習いバニー';
    else if (score < 40) rank = '一人前のバニー給仕';
    else rank = '伝説のダンディ';
    document.getElementById('final').textContent = score + '本';
    document.getElementById('rank').textContent = rank;
    document.getElementById('best').textContent = 'これまでの最高 ' + best + '本';
    endOv.hidden = false;
    document.getElementById('againBtn').focus();
  }

  function loop(now) {
    if (!running) return;
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw(dt);
    if (running) requestAnimationFrame(loop);
  }

  function update(dt) {
    elapsed += dt;
    const left = Math.max(0, GAME_TIME - elapsed);
    timeEl.textContent = String(Math.ceil(left));
    if (left <= 0) { finish(); return; }

    // move player
    const stuck = elapsed < stuckUntil;
    const dizzy = elapsed < dizzyUntil;
    if (!stuck) {
      if (keys.left || keys.right) {
        let dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
        if (dizzy) dir = -dir;
        player.target = player.x + dir * 400 * dt;
      }
      const maxSpeed = 700;
      const diff = player.target - player.x;
      const step = Math.sign(diff) * Math.min(Math.abs(diff), maxSpeed * dt);
      player.x += step;
    }
    player.x = Math.min(Math.max(player.x, 40), W - 40);
    player.target = Math.min(Math.max(player.target, 40), W - 40);

    // spawn
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      const t = pickType();
      items.push({
        t, x: 24 + Math.random() * (W - 48), y: -20,
        vy: 150 + elapsed * 7 + Math.random() * 60,
        rot: (Math.random() - 0.5) * 0.6
      });
      spawnTimer = Math.max(0.32, 0.7 - elapsed * 0.012);
    }

    // items
    const trayY = H - 20 - 112;
    for (const it of items) {
      it.y += it.vy * dt;
      if (!it.done && it.y > trayY - 22 && it.y < trayY + 12 && Math.abs(it.x - player.x) < 46) {
        it.done = true;
        hit(it);
      }
    }
    items = items.filter(it => !it.done && it.y < H + 40);

    for (const p of pops) { p.y -= 40 * dt; p.life -= dt; }
    pops = pops.filter(p => p.life > 0);

    if (statusUntil && elapsed > statusUntil) { statusEl.textContent = ''; statusUntil = 0; }
  }

  function hit(it) {
    const px = player.x, py = H - 150;
    switch (it.t.kind) {
      case 'carrot':
        score += 1; pops.push({ x: px, y: py, text: '+1', color: '#E8792E', life: 0.7 }); break;
      case 'cocktail':
        score += 5; pops.push({ x: px, y: py, text: '+5', color: '#F4A7B9', life: 0.9 });
        setStatus('人参カクテルでダンディ度アップ！', 1.4); break;
      case 'swirl':
        dizzyUntil = elapsed + 3; setStatus('愛の渦で左右があべこべ！', 3); break;
      case 'trap':
        stuckUntil = elapsed + 1.5; setStatus('ほいほいに捕まった！', 1.5); break;
    }
    scoreEl.textContent = String(score);
  }

  function drawOjisan(x, base) {
    const dizzy = running && elapsed < dizzyUntil;
    const stuck = running && elapsed < stuckUntil;
    const skin = '#F2C9A0', line = '#6B4A3A', black = '#2A2A35';

    if (stuck) {
      ctx.fillStyle = 'rgba(240,210,120,.55)';
      ctx.beginPath(); ctx.ellipse(x, base + 2, 44, 8, 0, 0, Math.PI * 2); ctx.fill();
    }
    // legs
    ctx.fillStyle = '#D8B08A';
    ctx.fillRect(x - 14, base - 30, 10, 28);
    ctx.fillRect(x + 4, base - 30, 10, 28);
    ctx.fillStyle = black;
    ctx.beginPath(); ctx.ellipse(x - 10, base - 2, 9, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 10, base - 2, 9, 4, 0, 0, Math.PI * 2); ctx.fill();
    // torso
    ctx.fillStyle = skin; ctx.strokeStyle = line; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(x, base - 56, 24, 28, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = black;
    ctx.beginPath(); ctx.ellipse(x, base - 44, 23, 18, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(x + 22, base - 40, 6, 0, Math.PI * 2); ctx.fill();
    // arms up
    ctx.strokeStyle = skin; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 18, base - 74); ctx.lineTo(x - 34, base - 106); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 18, base - 74); ctx.lineTo(x + 34, base - 106); ctx.stroke();
    // ears
    ctx.fillStyle = black;
    ctx.save(); ctx.translate(x - 8, base - 116); ctx.rotate(-0.25);
    ctx.beginPath(); ctx.ellipse(0, 0, 5, 16, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    ctx.save(); ctx.translate(x + 8, base - 116); ctx.rotate(0.25);
    ctx.beginPath(); ctx.ellipse(0, 0, 5, 16, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    // head
    ctx.fillStyle = skin; ctx.strokeStyle = line; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(x, base - 88, 16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#A6A6AE';
    ctx.beginPath(); ctx.ellipse(x - 15, base - 88, 4, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 15, base - 88, 4, 7, 0, 0, Math.PI * 2); ctx.fill();
    // eyes
    if (dizzy) {
      ctx.strokeStyle = '#3A2A20'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(x - 6, base - 91, 3, 0, Math.PI * 1.7); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + 6, base - 91, 3, 0, Math.PI * 1.7); ctx.stroke();
    } else {
      ctx.fillStyle = '#3A2A20';
      ctx.beginPath(); ctx.arc(x - 6, base - 91, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 6, base - 91, 2, 0, Math.PI * 2); ctx.fill();
    }
    // mustache
    ctx.fillStyle = '#7A7A82';
    ctx.beginPath(); ctx.ellipse(x - 6, base - 82, 7, 3, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 6, base - 82, 7, 3, -0.2, 0, Math.PI * 2); ctx.fill();
    // bow tie
    ctx.fillStyle = '#B83636';
    ctx.beginPath(); ctx.moveTo(x, base - 70); ctx.lineTo(x - 8, base - 75); ctx.lineTo(x - 8, base - 65); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x, base - 70); ctx.lineTo(x + 8, base - 75); ctx.lineTo(x + 8, base - 65); ctx.closePath(); ctx.fill();
    // tray
    ctx.fillStyle = '#C8CCD4'; ctx.strokeStyle = '#8A8F9A'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.ellipse(x, base - 112, 42, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // stars
    ctx.fillStyle = 'rgba(232,230,245,.8)';
    for (const s of stars) { ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2); ctx.fill(); }
    // floor
    ctx.fillStyle = 'rgba(27,34,71,.9)';
    ctx.fillRect(0, H - 18, W, 18);
    // items
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '34px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    for (const it of items) {
      ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot);
      ctx.fillText(it.t.e, 0, 0); ctx.restore();
    }
    drawOjisan(player.x || W / 2, H - 20);
    // pops
    ctx.font = '800 22px "M PLUS Rounded 1c",sans-serif';
    for (const p of pops) {
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('againBtn').addEventListener('click', start);
  resize();
})();
</script>
</body>
</html>
