<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おちゲー - Falling Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #05060f;
    font-family: 'Segoe UI', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    touch-action: none;
  }
  #game { display: block; width: 100vw; height: 100vh; }

  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; text-align: center;
    background: rgba(5, 6, 20, 0.72);
    backdrop-filter: blur(3px);
    z-index: 10;
    gap: 14px;
    padding: 20px;
  }
  .hidden { display: none !important; }

  .title {
    font-size: clamp(32px, 9vw, 56px);
    font-weight: 800;
    background: linear-gradient(180deg, #ffe08a, #ff7ab8 60%, #7ad9ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 2px;
    text-shadow: 0 4px 24px rgba(255,255,255,0.15);
  }
  .subtitle { font-size: clamp(13px, 3.6vw, 16px); color: #cfd6ff; opacity: 0.85; line-height: 1.7; max-width: 420px; }
  .subtitle b { color: #ffe08a; }

  .btn {
    margin-top: 6px;
    padding: 14px 42px;
    font-size: clamp(16px, 4vw, 20px);
    font-weight: 700;
    color: #1a0b2e;
    background: linear-gradient(180deg, #ffe08a, #ffb347);
    border: none;
    border-radius: 999px;
    box-shadow: 0 6px 0 #c07a1d, 0 10px 20px rgba(0,0,0,0.4);
    cursor: pointer;
    transition: transform 0.08s ease;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c07a1d, 0 4px 10px rgba(0,0,0,0.4); }

  .scoreRow { display: flex; gap: 28px; margin-top: 4px; }
  .scoreBox { display: flex; flex-direction: column; align-items: center; }
  .scoreBox .num { font-size: clamp(28px, 8vw, 42px); font-weight: 800; color: #7ad9ff; }
  .scoreBox .lbl { font-size: 12px; opacity: 0.75; letter-spacing: 1px; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 18px;
    color: #fff;
    pointer-events: none;
    z-index: 5;
    font-weight: 700;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  #hud .score { font-size: clamp(22px, 6vw, 30px); }
  #hud .best { font-size: 13px; opacity: 0.8; margin-top: 2px; }
  #combo {
    font-size: clamp(14px, 4vw, 18px);
    color: #ffe08a;
    opacity: 0;
    transition: opacity 0.2s;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div>
    <div class="score" id="scoreDisplay">0</div>
    <div class="best" id="bestDisplay">BEST 0</div>
  </div>
  <div id="combo">COMBO x1</div>
</div>

<div class="overlay" id="startScreen">
  <div class="title">おちゲー</div>
  <div class="subtitle">
    ずっと落下し続けるキャラを操作して<br>
    障害物を避けながら<b>コイン</b>を集めよう!<br><br>
    <b>← → / A D</b> または <b>画面タップ左右</b>で移動
  </div>
  <button class="btn" id="startBtn">スタート</button>
</div>

<div class="overlay hidden" id="gameOverScreen">
  <div class="title" style="font-size:clamp(28px,8vw,44px);">GAME OVER</div>
  <div class="scoreRow">
    <div class="scoreBox"><div class="num" id="finalScore">0</div><div class="lbl">SCORE</div></div>
    <div class="scoreBox"><div class="num" id="finalBest">0</div><div class="lbl">BEST</div></div>
  </div>
  <button class="btn" id="retryBtn">もう一度</button>
</div>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOverScreen');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const bestDisplay = document.getElementById('bestDisplay');
  const finalScore = document.getElementById('finalScore');
  const finalBest = document.getElementById('finalBest');
  const comboEl = document.getElementById('combo');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');

  const BEST_KEY = 'ochigame_best_score';
  let best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  bestDisplay.textContent = 'BEST ' + best;

  let state = 'start'; // start | playing | over
  let player, obstacles, coins, particles, bgStars;
  let score = 0, distance = 0, elapsed = 0, fallSpeed = 0, spawnTimer = 0, coinTimer = 0;
  let combo = 1, comboTimer = 0;
  let shake = 0;

  const input = { left: false, right: false, target: null };

  function resetGame() {
    player = {
      x: W / 2,
      y: H * 0.32,
      r: 18,
      vx: 0,
      tilt: 0,
    };
    obstacles = [];
    coins = [];
    particles = [];
    bgStars = [];
    for (let i = 0; i < 60; i++) {
      bgStars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + 0.4, speed: Math.random() * 0.5 + 0.3 });
    }
    score = 0; distance = 0; elapsed = 0; fallSpeed = 5.5; spawnTimer = 0; coinTimer = 0;
    combo = 1; comboTimer = 0; shake = 0;
  }

  function startGame() {
    resetGame();
    state = 'playing';
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
  }

  function endGame() {
    state = 'over';
    if (score > best) {
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
    }
    finalScore.textContent = score;
    finalBest.textContent = best;
    bestDisplay.textContent = 'BEST ' + best;
    gameOverScreen.classList.remove('hidden');
    shake = 18;
  }

  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);

  // --- Input ---
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') input.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') input.right = true;
    if ((e.key === ' ' || e.key === 'Enter') && state !== 'playing') {
      state === 'start' ? startGame() : startGame();
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') input.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') input.right = false;
  });

  function pointerDown(x) {
    if (state !== 'playing') return;
    if (x < W / 2) { input.left = true; input.right = false; }
    else { input.right = true; input.left = false; }
  }
  function pointerUp() { input.left = false; input.right = false; }

  canvas.addEventListener('pointerdown', (e) => pointerDown(e.clientX));
  canvas.addEventListener('pointerup', pointerUp);
  canvas.addEventListener('pointercancel', pointerUp);
  canvas.addEventListener('pointerleave', pointerUp);

  // --- Spawning ---
  function spawnObstacle() {
    const patterns = ['gapWall', 'zigzagRock', 'sideSpike', 'movingBlock'];
    const type = patterns[Math.floor(Math.random() * patterns.length)];

    if (type === 'gapWall') {
      const gapW = Math.max(90, 170 - elapsed * 1.1);
      const gapX = Math.random() * (W - gapW);
      obstacles.push({ type: 'wall', y: H + 30, h: 26, gapX, gapW, hit: false });
    } else if (type === 'zigzagRock') {
      const count = 3;
      for (let i = 0; i < count; i++) {
        obstacles.push({
          type: 'rock',
          x: (W / (count + 1)) * (i + 1) + (Math.random() - 0.5) * 40,
          y: H + 60 + i * 90,
          r: 22 + Math.random() * 10,
          hit: false,
        });
      }
    } else if (type === 'sideSpike') {
      const fromLeft = Math.random() < 0.5;
      obstacles.push({
        type: 'spike',
        x: fromLeft ? 0 : W,
        y: H + 40,
        w: W * (0.45 + Math.random() * 0.15),
        fromLeft,
        hit: false,
      });
    } else if (type === 'movingBlock') {
      obstacles.push({
        type: 'moving',
        x: Math.random() * W,
        y: H + 40,
        r: 24,
        dir: Math.random() < 0.5 ? -1 : 1,
        hit: false,
      });
    }
  }

  function spawnCoin() {
    coins.push({
      x: 40 + Math.random() * (W - 80),
      y: H + 20,
      r: 11,
      taken: false,
      spin: Math.random() * Math.PI * 2,
    });
  }

  function spawnParticles(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = Math.random() * 4 + 1;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 30 + Math.random() * 20,
        maxLife: 50,
        color,
        r: Math.random() * 3 + 1.5,
      });
    }
  }

  // --- Update ---
  function update(dt) {
    elapsed += dt;
    distance += fallSpeed * dt * 60;
    fallSpeed = Math.min(16, 5.5 + elapsed * 0.09);
    score = Math.floor(distance / 10);
    scoreDisplay.textContent = score;

    // combo decay
    if (comboTimer > 0) {
      comboTimer -= dt;
      if (comboTimer <= 0) { combo = 1; comboEl.style.opacity = 0; }
    }

    // player horizontal control
    const accel = 0.9;
    const maxV = 8.5;
    if (input.left && !input.right) player.vx -= accel;
    else if (input.right && !input.left) player.vx += accel;
    else player.vx *= 0.85;
    player.vx = Math.max(-maxV, Math.min(maxV, player.vx));
    player.x += player.vx;
    player.tilt = player.vx * 1.7;

    if (player.x < player.r) { player.x = player.r; player.vx = 0; }
    if (player.x > W - player.r) { player.x = W - player.r; player.vx = 0; }

    // background stars drift upward relative to fall
    for (const s of bgStars) {
      s.y -= fallSpeed * s.speed * 0.6;
      if (s.y < 0) { s.y = H + 5; s.x = Math.random() * W; }
    }

    // spawn timers
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnObstacle();
      spawnTimer = Math.max(0.55, 1.5 - elapsed * 0.012);
    }
    coinTimer -= dt;
    if (coinTimer <= 0) {
      spawnCoin();
      coinTimer = 0.9 + Math.random() * 0.8;
    }

    // move obstacles down, check collisions
    for (const o of obstacles) {
      o.y -= fallSpeed * dt * 60;
      if (o.type === 'moving') {
        o.x += o.dir * 2.2;
        if (o.x < o.r || o.x > W - o.r) o.dir *= -1;
      }
      if (!o.hit) checkCollision(o);
    }
    obstacles = obstacles.filter(o => o.y > -150);

    // coins
    for (const c of coins) {
      c.y -= fallSpeed * dt * 60;
      c.spin += dt * 6;
      if (!c.taken) {
        const dx = c.x - player.x, dy = c.y - player.y;
        if (dx * dx + dy * dy < (c.r + player.r) * (c.r + player.r)) {
          c.taken = true;
          combo = Math.min(9, combo + 1);
          comboTimer = 2.2;
          score += 5 * combo;
          comboEl.textContent = 'COMBO x' + combo;
          comboEl.style.opacity = combo > 1 ? 1 : 0;
          spawnParticles(c.x, c.y, '#ffe08a', 10);
        }
      }
    }
    coins = coins.filter(c => c.y > -40 && !c.taken);

    // particles
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 1;
    }
    particles = particles.filter(p => p.life > 0);

    if (shake > 0) shake *= 0.9;
  }

  function checkCollision(o) {
    if (o.type === 'wall') {
      const nearY = Math.abs(o.y - player.y) < o.h / 2 + player.r;
      if (nearY) {
        const inGap = player.x - player.r > o.gapX && player.x + player.r < o.gapX + o.gapW;
        if (!inGap) { o.hit = true; hitPlayer(); }
      }
    } else if (o.type === 'rock' || o.type === 'moving') {
      const dx = o.x - player.x, dy = o.y - player.y;
      const rr = (o.r + player.r) * 0.85;
      if (dx * dx + dy * dy < rr * rr) { o.hit = true; hitPlayer(); }
    } else if (o.type === 'spike') {
      const nearY = Math.abs(o.y - player.y) < 20 + player.r;
      if (nearY) {
        const reach = o.fromLeft ? o.w : W - o.w;
        const inSpike = o.fromLeft ? player.x - player.r < reach : player.x + player.r > reach;
        if (inSpike) { o.hit = true; hitPlayer(); }
      }
    }
  }

  function hitPlayer() {
    spawnParticles(player.x, player.y, '#ff5a7a', 26);
    shake = 18;
    endGame();
  }

  // --- Draw ---
  function drawBackground() {
    const hue = 230 + Math.sin(elapsed * 0.05) * 20;
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, `hsl(${hue}, 55%, 10%)`);
    grad.addColorStop(1, `hsl(${hue + 30}, 60%, 18%)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    for (const s of bgStars) {
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y);
    ctx.rotate(player.tilt * Math.PI / 180);

    // trail
    ctx.beginPath();
    ctx.fillStyle = 'rgba(122,217,255,0.25)';
    ctx.ellipse(0, -player.r * 1.6, player.r * 0.7, player.r * 1.3, 0, 0, Math.PI * 2);
    ctx.fill();

    // body
    const g = ctx.createRadialGradient(-6, -6, 4, 0, 0, player.r);
    g.addColorStop(0, '#fff3c4');
    g.addColorStop(1, '#ff7ab8');
    ctx.beginPath();
    ctx.fillStyle = g;
    ctx.arc(0, 0, player.r, 0, Math.PI * 2);
    ctx.fill();

    // face
    ctx.fillStyle = '#2a1030';
    ctx.beginPath(); ctx.arc(-6, -2, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(6, -2, 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 4, 6, 0, Math.PI);
    ctx.strokeStyle = '#2a1030';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.restore();
  }

  function drawObstacles() {
    for (const o of obstacles) {
      if (o.type === 'wall') {
        ctx.fillStyle = '#5b3a9e';
        ctx.fillRect(0, o.y - o.h / 2, o.gapX, o.h);
        ctx.fillRect(o.gapX + o.gapW, o.y - o.h / 2, W - (o.gapX + o.gapW), o.h);
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect(0, o.y - o.h / 2, o.gapX, 4);
        ctx.fillRect(o.gapX + o.gapW, o.y - o.h / 2, W - (o.gapX + o.gapW), 4);
      } else if (o.type === 'rock') {
        const g = ctx.createRadialGradient(o.x - 6, o.y - 6, 2, o.x, o.y, o.r);
        g.addColorStop(0, '#9d8bff');
        g.addColorStop(1, '#4a2f8f');
        ctx.beginPath();
        ctx.fillStyle = g;
        ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
        ctx.fill();
      } else if (o.type === 'moving') {
        const g = ctx.createRadialGradient(o.x - 6, o.y - 6, 2, o.x, o.y, o.r);
        g.addColorStop(0, '#ffb3c6');
        g.addColorStop(1, '#c23b5e');
        ctx.beginPath();
        ctx.fillStyle = g;
        ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2);
        ctx.fill();
      } else if (o.type === 'spike') {
        ctx.fillStyle = '#ff8f5a';
        ctx.beginPath();
        if (o.fromLeft) {
          ctx.moveTo(0, o.y - 22); ctx.lineTo(o.w, o.y); ctx.lineTo(0, o.y + 22);
        } else {
          ctx.moveTo(W, o.y - 22); ctx.lineTo(W - o.w, o.y); ctx.lineTo(W, o.y + 22);
        }
        ctx.closePath();
        ctx.fill();
      }
    }
  }

  function drawCoins() {
    for (const c of coins) {
      if (c.taken) continue;
      const scaleX = Math.abs(Math.cos(c.spin));
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(Math.max(0.15, scaleX), 1);
      const g = ctx.createRadialGradient(-3, -3, 1, 0, 0, c.r);
      g.addColorStop(0, '#fff9d6');
      g.addColorStop(1, '#ffcf3d');
      ctx.beginPath();
      ctx.fillStyle = g;
      ctx.arc(0, 0, c.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.save();
    if (shake > 0.3) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    drawBackground();
    drawObstacles();
    drawCoins();
    if (state !== 'over' || shake > 0.3) drawPlayer();
    drawParticles();
    ctx.restore();
  }

  // --- Loop ---
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - lastTime) / 1000);
    lastTime = now;

    if (state === 'playing') update(dt);
    else if (shake > 0.3) shake *= 0.9;

    render();
    requestAnimationFrame(loop);
  }

  // idle background animation before start
  bgStars = [];
  for (let i = 0; i < 60; i++) {
    bgStars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + 0.4, speed: Math.random() * 0.5 + 0.3 });
  }
  player = { x: W / 2, y: -999, r: 18, vx: 0, tilt: 0 };
  obstacles = []; coins = []; particles = [];

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
