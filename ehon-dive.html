<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>えほんダイブ</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#2a2850;
    font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif;color:#3a2e42;
    -webkit-user-select:none;user-select:none;touch-action:none}
  canvas#game{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
  .overlay{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;
    padding:16px;touch-action:manipulation}
  .overlay[hidden]{display:none}
  .card{background:#fdf6e4;border:5px solid #f5a25a;border-radius:28px;box-shadow:0 8px 0 rgba(0,0,0,.25);
    width:100%;max-width:640px;max-height:100%;overflow:auto;padding:22px 18px 18px;text-align:center}
  h1{margin:0;font-size:clamp(34px,9vw,54px);color:#e2703a;letter-spacing:.04em}
  .lead{margin:6px 0 14px;font-size:clamp(16px,4.2vw,21px)}
  .pick{display:flex;gap:14px;justify-content:center}
  button{font:inherit;color:inherit;cursor:pointer;border:4px solid #3a2e42;border-radius:22px;background:#fff;
    box-shadow:0 6px 0 #3a2e42;padding:10px 14px;font-weight:bold;font-size:clamp(18px,4.6vw,24px);touch-action:manipulation}
  button:active{transform:translateY(4px);box-shadow:0 2px 0 #3a2e42}
  button:focus-visible{outline:4px solid #5aa0ff;outline-offset:3px}
  .pick button{flex:1;max-width:230px;padding:8px 8px 12px}
  .pick canvas{width:100%;height:auto;display:block}
  .fox{background:#fff0dc}.cat{background:#e9ecfa}
  .how{margin:14px 0 4px;font-size:clamp(14px,3.6vw,17px);line-height:1.7}
  .small{font-size:12px;opacity:.7;margin-top:10px}
  .small a{color:inherit}
  .big{font-size:clamp(44px,12vw,72px);font-weight:bold;color:#e2703a;line-height:1.1;margin:6px 0}
  .msg{font-size:clamp(20px,5vw,28px);font-weight:bold;margin:4px 0 2px}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .main{background:#ffd95a}
  #mute{position:fixed;right:10px;top:10px;width:54px;height:54px;padding:0;border-radius:50%;font-size:24px;
    box-shadow:0 4px 0 #3a2e42;z-index:5;top:calc(10px + env(safe-area-inset-top,0px))}
</style>
</head>
<body>
<canvas id="game" aria-label="えほんダイブの がめん"></canvas>
<button id="mute" aria-label="おとを きりかえる">🔈</button>

<div class="overlay" id="title">
  <div class="card">
    <h1>えほんダイブ</h1>
    <p class="lead">えほんの なかへ とびこもう！<br>どっちで あそぶ？</p>
    <div class="pick">
      <button class="fox" data-kind="fox"><canvas width="300" height="300" id="pFox"></canvas>きつね</button>
      <button class="cat" data-kind="cat"><canvas width="300" height="300" id="pCat"></canvas>ねこ</button>
    </div>
    <p class="how">ゆびで がめんを なぞると うごくよ。<br>⭐ ほしを あつめて、おじゃまものは よけよう。</p>
    <p class="small"><a href="index.html">← あそびばへ もどる</a>　／　🤖 つくったAI：Claude Fable 5.2</p>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card">
    <h1>おしまい</h1>
    <p class="lead">あつめた ほし</p>
    <div class="big"><span id="score">0</span> こ</div>
    <div class="msg" id="msg"></div>
    <div id="best" class="how"></div>
    <div class="row">
      <button class="main" id="again">もういちど</button>
      <button id="change">キャラを かえる</button>
    </div>
    <p class="small"><a href="index.html">← あそびばへ もどる</a></p>
  </div>
</div>

<script>
(function(){
'use strict';
var cv = document.getElementById('game'), ctx = cv.getContext('2d');
var W = 720, H = 1100, scale = 1, dpr = 1, offX = 0, viewW = 720;
var INK = '#3a2e42', CREAM = '#fff9ee', PINK = '#ffaab4', GOLD = '#ffcd46', PAPER = '#fdf6e4';
var FONT = '"Hiragino Maru Gothic ProN","BIZ UDPGothic","Meiryo",sans-serif';
var TAU = Math.PI * 2;
function rnd(a, b){ return a + Math.random() * (b - a); }
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function easeOut(t){ t = clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); }

// ---------- がめんの おおきさ ----------
var quality = 2;
function resize(){
  var cw = window.innerWidth, ch = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, quality);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  H = 1100; scale = ch / H; viewW = cw / scale;
  if (viewW < 620){ scale = cw / 620; viewW = 620; H = ch / scale; }
  W = Math.min(viewW, 1000); offX = (viewW - W) / 2;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 200); });
resize();

// ---------- えを かく どうぐ ----------
function ell(c, x, y, rx, ry, fill, stroke, lw){
  c.beginPath(); c.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, TAU);
  if (fill){ c.fillStyle = fill; c.fill(); }
  if (stroke){ c.strokeStyle = stroke; c.lineWidth = lw || 7; c.stroke(); }
}
function poly(c, pts, fill, stroke, lw){
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (var i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.closePath();
  if (fill){ c.fillStyle = fill; c.fill(); }
  if (stroke){ c.strokeStyle = stroke; c.lineWidth = lw || 7; c.stroke(); }
}
function line(c, x0, y0, x1, y1, col, lw){
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.strokeStyle = col; c.lineWidth = lw; c.stroke();
}
function rrect(c, x, y, w, h, r){
  c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
}
function star(c, x, y, r, rot, fill, stroke, lw, n, inner){
  n = n || 5; inner = inner || 0.47;
  c.beginPath();
  for (var i = 0; i < n * 2; i++){
    var rr = i % 2 ? r * inner : r, a = rot - Math.PI / 2 + i * Math.PI / n;
    if (i) c.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); else c.moveTo(x + rr * Math.cos(a), y + rr * Math.sin(a));
  }
  c.closePath();
  if (fill){ c.fillStyle = fill; c.fill(); }
  if (stroke){ c.strokeStyle = stroke; c.lineWidth = lw || 5; c.stroke(); }
}

// ---------- きつねと ねこ ----------
var LOOK = {
  fox: { body: '#fa9848', paw: '#70483e', ear: '#ffc8c3' },
  cat: { body: '#b0b6d4', paw: CREAM, ear: '#ffc8c3', stripe: '#7076a2' }
};
function drawChara(c, kind, x, y, s, t, o){
  o = o || {};
  var L = LOOK[kind], fall = !!o.fall, i, sgn;
  c.save(); c.translate(x, y); c.rotate(o.rot || 0); c.scale(s, s); c.translate(0, 190);
  c.lineJoin = 'round'; c.lineCap = 'round';
  // しっぽ
  var tail = [], wag = Math.sin(t * 7), u;
  if (kind === 'fox'){
    var base = [[62,-50,32],[104,-72,42],[138,-110,50],[154,-158,48],[150,-202,38],[140,-234,25]];
    for (i = 0; i < base.length; i++)
      tail.push([base[i][0] + wag * 16 * i / 5 + (fall ? -i * 6 : 0), base[i][1] - (fall ? i * 14 : 0), base[i][2], i >= 4 ? CREAM : L.body]);
  } else {
    for (i = 0; i < 26; i++){
      u = i / 25;
      tail.push([58 + 95 * u + 34 * Math.sin(u * 3) + wag * 22 * u * u - 40 * u * u * u - (fall ? 50 * u : 0),
                 -36 - (fall ? 270 : 215) * Math.pow(u, 1.2), 17 - 3 * u, i >= 21 ? L.stripe : L.body]);
    }
  }
  for (i = 0; i < tail.length; i++) ell(c, tail[i][0], tail[i][1], tail[i][2] + 7, tail[i][2] + 7, INK);
  for (i = 0; i < tail.length; i++) ell(c, tail[i][0], tail[i][1], tail[i][2], tail[i][2], tail[i][3]);
  // うで
  var sh = [[-56,-126],[56,-126]], hands;
  function polar(p, deg, len){ var a = deg * Math.PI / 180; return [p[0] + len * Math.cos(a), p[1] - len * Math.sin(a)]; }
  if (o.arms === 'down') hands = [[-110,-70],[110,-70]];
  else if (o.arms === 'wave') hands = [[-110,-70], polar(sh[1], 48 + 28 * Math.sin(t * 9), 92)];
  else hands = [polar(sh[0], 130 + 12 * Math.sin(t * 11), 92), polar(sh[1], 50 - 12 * Math.sin(t * 11), 92)];
  for (i = 0; i < 2; i++){
    line(c, sh[i][0], sh[i][1], hands[i][0], hands[i][1], INK, 37);
    line(c, sh[i][0], sh[i][1], hands[i][0], hands[i][1], L.body, 23);
    ell(c, hands[i][0], hands[i][1], 16, 16, L.paw, INK, 6);
  }
  // からだ
  ell(c, 0, -84, 72, 78, L.body, INK, 7.5);
  ell(c, 0, -72, 42, 52, CREAM);
  for (sgn = -1; sgn <= 1; sgn += 2)
    ell(c, sgn * 38 + (fall ? sgn * 6 * Math.sin(t * 9) : 0), -10 + (fall ? 4 * Math.sin(t * 9 + sgn) : 0), 28, 17, L.paw, INK, 7.5);
  // みみ
  for (sgn = -1; sgn <= 1; sgn += 2){
    var tip = kind === 'cat' ? [sgn * 122, -428] : [sgn * 130, -474];
    var a_ = kind === 'cat' ? [sgn * 144, -312] : [sgn * 140, -318], b_ = kind === 'cat' ? [sgn * 36, -370] : [sgn * 28, -374];
    poly(c, [a_, tip, b_], L.body, INK, 7.5);
    poly(c, kind === 'cat' ? [[sgn*120,-338],[sgn*115,-400],[sgn*64,-366]] : [[sgn*118,-342],[sgn*119,-428],[sgn*60,-370]], L.ear);
    if (kind === 'fox')
      poly(c, [tip, [tip[0] + (a_[0] - tip[0]) * .3, tip[1] + (a_[1] - tip[1]) * .3],
               [tip[0] + (b_[0] - tip[0]) * .3, tip[1] + (b_[1] - tip[1]) * .3]], L.paw, INK, 7.5);
  }
  // あたま
  ell(c, 0, -255, 152, 122, L.body, INK, 7.5);
  ell(c, 0, -204, 50, 33, CREAM);
  if (kind === 'cat'){
    for (i = -1; i <= 1; i++) line(c, i * 26, -364 + Math.abs(i) * 7, i * 26, -332, L.stripe, 9);
    for (sgn = -1; sgn <= 1; sgn += 2){
      line(c, sgn * 120, -206, sgn * 190, -220, INK, 4.5);
      line(c, sgn * 120, -194, sgn * 188, -186, INK, 4.5);
    }
  }
  for (sgn = -1; sgn <= 1; sgn += 2) ell(c, sgn * 112, -208, 25, 15, PINK);
  // かお
  var eyes = o.eyes || 'normal';
  if (eyes === 'normal' && (t % 2.9) > 2.76) eyes = 'blink';
  for (sgn = -1; sgn <= 1; sgn += 2){
    var ex = sgn * 68, ey = -246;
    c.strokeStyle = INK; c.lineWidth = 8.5;
    if (eyes === 'happy'){ c.beginPath(); c.arc(ex, ey + 12, 25, Math.PI * 1.12, Math.PI * 1.88); c.stroke(); }
    else if (eyes === 'blink'){ c.beginPath(); c.arc(ex, ey - 12, 22, Math.PI * 0.15, Math.PI * 0.85); c.stroke(); }
    else if (eyes === 'hurt'){
      c.beginPath(); c.moveTo(ex - sgn * 18, ey - 16); c.lineTo(ex + sgn * 14, ey); c.lineTo(ex - sgn * 18, ey + 16); c.stroke();
    } else {
      ell(c, ex, ey, 23, 29, INK);
      ell(c, ex - 7, ey - 11, 10, 10, '#fff'); ell(c, ex + 8, ey + 11, 5.5, 5.5, '#fff'); ell(c, ex - 10, ey + 12, 3, 3, '#fff');
    }
  }
  ell(c, 0, -216, 10, 7.5, INK);
  if (o.mouth === 'w'){
    c.strokeStyle = INK; c.lineWidth = 5.5;
    c.beginPath(); c.arc(-10, -207, 10, 0, Math.PI); c.stroke();
    c.beginPath(); c.arc(10, -207, 10, 0, Math.PI); c.stroke();
  } else ell(c, 0, -196, 11, 12, '#f57882', INK, 5.5);
  // ぼうし
  var lift = fall ? 26 + 8 * Math.sin(t * 6) : 0, cy = -372 - lift, k = 0.52;
  poly(c, [[-70*k,cy-30*k],[70*k,cy-30*k],[62*k,cy+14*k],[-62*k,cy+14*k]], '#484c82', INK, 6);
  poly(c, [[0,cy-78*k],[128*k,cy-44*k],[0,cy-10*k],[-128*k,cy-44*k]], '#6a6ea0', INK, 6);
  var sw = 12 * Math.sin(t * 6);
  c.beginPath(); c.moveTo(0, cy - 44*k); c.lineTo((92 + sw*.4)*k, cy - 30*k); c.lineTo((96 + sw)*k, cy + (fall ? -30 : 22)*k);
  c.strokeStyle = GOLD; c.lineWidth = 5; c.stroke();
  ell(c, (96 + sw)*k, cy + (fall ? -30 : 22)*k, 8, 9, GOLD, INK, 3.5);
  c.restore();
}

// ---------- おと ----------
var ac = null, master = null, muted = false, bgmTimer = null, bgmNext = 0, bgmStep = 0;
try { muted = localStorage.getItem('ehonDive.mute') === '1'; } catch (e) {}
var muteBtn = document.getElementById('mute');
function showMute(){ muteBtn.textContent = muted ? '🔇' : '🔈'; }
showMute();
function audioOn(){
  try {
    if (!ac){
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ac = new AC(); master = ac.createGain(); master.gain.value = muted ? 0 : 0.7; master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
  } catch (e) { ac = null; }
}
function tone(f, t0, dur, vol, type){
  if (!ac) return;
  var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + (t0 || 0);
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  return o;
}
var PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1568, 1760];
function sfxStar(combo){ tone(PENTA[Math.min(combo, PENTA.length - 1)], 0, 0.22, 0.16, 'triangle'); }
function sfxBig(){ for (var i = 0; i < 4; i++) tone([783.99, 1046.5, 1318.5, 1568][i], i * 0.07, 0.35, 0.14, 'triangle'); }
function sfxBump(){
  if (!ac) return;
  var o = tone(300, 0, 0.3, 0.22, 'sine');
  if (o) o.frequency.exponentialRampToValueAtTime(90, ac.currentTime + 0.28);
}
function sfxPage(){ for (var i = 0; i < 3; i++) tone([659.25, 783.99, 1046.5][i], i * 0.12, 0.5, 0.1, 'sine'); }
function sfxEnd(){ for (var i = 0; i < 5; i++) tone([523.25, 659.25, 783.99, 1046.5, 1318.5][i], i * 0.14, 0.9, 0.13, 'triangle'); }
// オルゴールの くりかえし
var MEL = [659.25,0,783.99,659.25,1046.5,0,783.99,0, 880,0,659.25,880,1046.5,987.77,880,0,
           698.46,0,880,698.46,1046.5,0,880,783.99, 783.99,987.77,1174.66,987.77,783.99,0,587.33,0];
var BAS = [130.81, 110, 87.31, 98];
function bgmTick(){
  if (!ac || state !== 'play') return;
  while (bgmNext < ac.currentTime + 0.25){
    var i = bgmStep % 32, t0 = Math.max(0, bgmNext - ac.currentTime);
    if (MEL[i]) tone(MEL[i], t0, 0.7, 0.05, 'sine');
    if (i % 4 === 0) tone(BAS[Math.floor(i / 8)], t0, 0.6, 0.07, 'triangle');
    if (i % 4 === 2) tone(BAS[Math.floor(i / 8)] * 2, t0, 0.3, 0.035, 'triangle');
    bgmNext += 0.23; bgmStep++;
  }
}
function bgmStart(){ if (!ac) return; bgmNext = ac.currentTime + 0.1; bgmStep = 0; clearInterval(bgmTimer); bgmTimer = setInterval(bgmTick, 80); }
function bgmStop(){ clearInterval(bgmTimer); bgmTimer = null; }
muteBtn.addEventListener('click', function(){
  muted = !muted; showMute(); audioOn();
  if (master) master.gain.value = muted ? 0 : 0.7;
  try { localStorage.setItem('ehonDive.mute', muted ? '1' : '0'); } catch (e) {}
});

// ---------- ゲームの なかみ ----------
var CH = [
  { name: 'よぞら',       top: '#2a2850', bot: '#5a4a96', speed: 330, gap: 520 },
  { name: 'うみの なか',   top: '#2a9fc0', bot: '#14507e', speed: 370, gap: 480 },
  { name: 'もりの なか',   top: '#8fd08a', bot: '#3f8a5c', speed: 400, gap: 450 },
  { name: 'おはなばたけ', top: '#ffd9c8', bot: '#fff3c9', speed: 370, gap: 480 }
];
var CH_TIME = 21, TOTAL = CH_TIME * 4;
var state = 'title', kind = 'fox', time = 0, clock = 0, dist = 0, chIdx = 0, stars = 0;
var px = 360, tx = 360, pvx = 0, invuln = 0, happy = 0, combo = 0, lastGet = -9, shake = 0;
var objs = [], parts = [], nextStar = 0, nextObs = 0, nextBig = 0;
var page = null, landT = 0, ended = false, hintT = 0;
var deco = [];
(function(){
  for (var i = 0; i < 60; i++) deco.push({ x: Math.random(), y: Math.random(), r: Math.random(), p: Math.random() * TAU, k: i % 4 });
})();

function pathX(d){
  return W / 2 + (W / 2 - 110) * (0.62 * Math.sin(d / 520) + 0.38 * Math.sin(d / 217 + 1.3));
}
function startGame(k){
  kind = k; audioOn();
  time = 0; dist = 0; chIdx = 0; stars = 0; objs = []; parts = []; px = tx = W / 2; pvx = 0;
  invuln = 0; happy = 0; combo = 0; lastGet = -9; shake = 0; landT = 0; ended = false; hintT = 5;
  nextStar = 300; nextObs = 1500; nextBig = 2200;
  page = { t: 0.5, to: 0 };
  state = 'play';
  document.getElementById('title').hidden = true; document.getElementById('end').hidden = true;
  sfxPage(); bgmStart();
}
function burst(x, y, col, n){
  for (var i = 0; i < n; i++){
    var a = rnd(0, TAU), sp = rnd(120, 360);
    parts.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, life: rnd(0.4, 0.8), max: 0.8, col: col, r: rnd(7, 14), star: true });
  }
}
function update(dt){
  clock += dt;
  if (state !== 'play') return;
  time += dt;
  var c = CH[chIdx], landing = time >= TOTAL;
  var v = landing ? c.speed * Math.max(0, 1 - landT / 1.3) : c.speed;
  dist += v * dt;
  // ページを めくる
  if (!page && !landing){
    var want = Math.min(3, Math.floor(time / CH_TIME));
    if (want !== chIdx){ page = { t: 0, to: want }; sfxPage(); }
  }
  if (page){
    var before = page.t; page.t += dt / 1.5;
    if (before < 0.5 && page.t >= 0.5) chIdx = page.to;
    if (page.t >= 1) page = null;
  }
  // うごかす
  var ox = px; px += (tx - px) * Math.min(1, dt * 11); px = clamp(px, 60, W - 60);
  pvx += ((px - ox) / dt - pvx) * Math.min(1, dt * 8);
  invuln = Math.max(0, invuln - dt); happy = Math.max(0, happy - dt); shake = Math.max(0, shake - dt); hintT -= dt;
  // だす
  var inCh = time % CH_TIME, quiet = inCh < 1.6 || inCh > CH_TIME - 1.8 || time > TOTAL - 2.5;
  if (!landing){
    while (dist >= nextStar){ if (time < TOTAL - 1.2) objs.push({ type: 'star', x: pathX(nextStar + 900), y: H + 60, r: 30, p: rnd(0, TAU) }); nextStar += 150; }
    while (dist >= nextObs){
      if (!quiet){
        var sx = pathX(nextObs + 900), side = sx > W / 2 ? -1 : 1, x = clamp(sx + side * rnd(200, 300), 80, W - 80);
        objs.push({ type: 'obs', kind: chIdx, x: x, y: H + 90, r: 52, p: rnd(0, TAU), vx: chIdx === 3 ? side * -40 : 0 });
      }
      nextObs += rnd(c.gap * 0.8, c.gap * 1.2);
    }
    while (dist >= nextBig){
      if (!quiet) objs.push({ type: 'big', x: clamp(W - pathX(nextBig + 900), 90, W - 90), y: H + 80, r: 44, p: 0 });
      nextBig += rnd(1900, 2600);
    }
  }
  var py = H * 0.3, i, o, dx, dy;
  for (i = objs.length - 1; i >= 0; i--){
    o = objs[i]; o.y -= (landing ? c.speed * 1.3 : v) * dt; if (o.vx) o.x += o.vx * dt;
    if (o.y < -120){ objs.splice(i, 1); continue; }
    dx = o.x - px; dy = o.y - py;
    if (o.type === 'obs'){
      if (!invuln && !landing && dx * dx + dy * dy < (o.r + 40) * (o.r + 40)){
        invuln = 1.7; shake = 0.35; sfxBump(); combo = 0;
        var drop = Math.min(stars, 3); stars -= drop;
        for (var k = 0; k < drop; k++){
          var a = rnd(-2.6, -0.5);
          parts.push({ x: px, y: py, vx: Math.cos(a) * 320, vy: Math.sin(a) * 320, life: 0.9, max: 0.9, col: GOLD, r: 20, star: true, g: 700 });
        }
      }
    } else if (dx * dx + dy * dy < (o.r + 62) * (o.r + 62)){
      objs.splice(i, 1);
      combo = (clock - lastGet < 1.3) ? combo + 1 : 0; lastGet = clock; happy = 0.35;
      if (o.type === 'big'){ stars += 5; sfxBig(); burst(o.x, o.y, '#ff8fb1', 14); burst(o.x, o.y, '#7fd4ff', 8); }
      else { stars += 1; sfxStar(combo); burst(o.x, o.y, GOLD, 5); }
    }
  }
  for (i = parts.length - 1; i >= 0; i--){
    o = parts[i]; o.life -= dt; if (o.life <= 0){ parts.splice(i, 1); continue; }
    o.x += o.vx * dt; o.y += o.vy * dt; o.vy += (o.g || 300) * dt;
  }
  if (landing){
    landT += dt;
    if (!ended && landT > 1.25){ ended = true; sfxEnd(); bgmStop(); burst(px, py + 60, '#ff8fb1', 18); burst(px, py + 60, '#fff', 10); }
    if (landT > 3.2) finish();
  }
}
function finish(){
  state = 'end';
  var best = 0, key = 'ehonDive.best.' + kind;
  try { best = parseInt(localStorage.getItem(key), 10) || 0; } catch (e) {}
  var isNew = stars > best;
  if (isNew){ try { localStorage.setItem(key, String(stars)); } catch (e) {} }
  document.getElementById('score').textContent = stars;
  document.getElementById('msg').textContent = stars >= 150 ? 'ほしの めいじん！' : stars >= 100 ? 'すごい すごい！' : stars >= 45 ? 'いい ちょうし！' : 'たのしかったね！';
  document.getElementById('best').textContent = isNew && best > 0 ? 'じこベスト こうしん！（まえは ' + best + ' こ）' : best > 0 ? 'いままでの いちばん：' + Math.max(best, stars) + ' こ' : '';
  document.getElementById('end').hidden = false;
}

// ---------- はいけい ----------
function wrap(v, m){ return ((v % m) + m) % m; }
function drawBg(i, t){
  var c = CH[i], g = ctx.createLinearGradient(0, 0, 0, H), j, d, x, y;
  g.addColorStop(0, c.top); g.addColorStop(1, c.bot);
  ctx.fillStyle = g; ctx.fillRect(-offX, 0, viewW, H);
  if (i === 0){
    for (j = 0; j < deco.length; j++){
      d = deco[j]; x = -offX + d.x * viewW; y = wrap(d.y * (H + 80) - dist * (0.05 + d.r * 0.1), H + 80) - 40;
      var tw = 0.5 + 0.5 * Math.sin(t * 2.5 + d.p);
      star(ctx, x, y, 4 + d.r * 9 * tw, 0, 'rgba(255,240,190,' + (0.35 + 0.6 * tw).toFixed(2) + ')', null, 0, 4, 0.3);
    }
    y = wrap(260 - dist * 0.12, H + 500) - 250;
    ell(ctx, W * 0.74, y, 92, 92, '#ffe9a8'); ell(ctx, W * 0.74 + 34, y - 20, 78, 78, c.top);
    for (j = 0; j < 5; j++){
      d = deco[j]; x = -offX + d.x * viewW; y = wrap(d.y * (H + 400) - dist * 0.45, H + 400) - 200;
      ctx.globalAlpha = 0.16; ell(ctx, x, y, 120, 44, '#fff'); ell(ctx, x + 70, y + 14, 90, 34, '#fff'); ell(ctx, x - 60, y + 16, 80, 30, '#fff'); ctx.globalAlpha = 1;
    }
  } else if (i === 1){
    ctx.globalAlpha = 0.1;
    for (j = 0; j < 4; j++){
      x = -offX + viewW * (0.1 + j * 0.27) + 40 * Math.sin(t * 0.5 + j);
      poly(ctx, [[x, 0], [x + 90, 0], [x + 300, H], [x + 80, H]], '#fff');
    }
    ctx.globalAlpha = 1;
    for (j = 0; j < 6; j++){
      d = deco[j]; var dir = j % 2 ? 1 : -1;
      x = -offX + wrap(d.x * (viewW + 300) + dir * t * (30 + d.r * 40), viewW + 300) - 150;
      y = wrap(d.y * (H + 300) - dist * 0.3, H + 300) - 150;
      ctx.globalAlpha = 0.22; ell(ctx, x, y, 46, 22, '#0d3558'); poly(ctx, [[x - dir * 40, y], [x - dir * 76, y - 22], [x - dir * 76, y + 22]], '#0d3558'); ctx.globalAlpha = 1;
    }
    for (j = 6; j < 40; j++){
      d = deco[j]; x = -offX + d.x * viewW + 10 * Math.sin(t * 2 + d.p);
      y = wrap(d.y * (H + 60) - dist * 0.6 - t * (60 + d.r * 80), H + 60) - 30;
      ctx.globalAlpha = 0.5; ell(ctx, x, y, 5 + d.r * 12, 5 + d.r * 12, null, '#dff6ff', 3); ctx.globalAlpha = 1;
    }
  } else if (i === 2){
    for (j = 0; j < 2; j++){
      var bx = j ? W + offX - 46 : -offX - 34, wd = 80;
      ctx.fillStyle = '#6b4a32'; ctx.fillRect(bx, 0, wd, H);
      ctx.fillStyle = '#5a3d29';
      for (var q = 0; q < 6; q++){ y = wrap(q * 230 - dist * 0.8, H + 230) - 115; ctx.fillRect(bx + 12 + (q % 3) * 14, y, 10, 70); }
      for (q = 0; q < 4; q++){
        y = wrap(q * 340 + j * 170 - dist * 0.8, H + 340) - 170; x = j ? bx : bx + wd;
        ell(ctx, x + (j ? -50 : 50), y, 110, 62, '#3f9a58'); ell(ctx, x + (j ? -110 : 110), y + 26, 70, 42, '#56b46a');
      }
    }
    for (j = 0; j < 26; j++){
      d = deco[j]; x = -offX + wrap(d.x * viewW + 40 * Math.sin(t * 1.2 + d.p), viewW);
      y = wrap(d.y * (H + 80) - dist * 0.55 + t * 30, H + 80) - 40;
      ctx.save(); ctx.translate(x, y); ctx.rotate(t * (0.6 + d.r) + d.p);
      ell(ctx, 0, 0, 16, 8, ['#ffd166', '#f79b4b', '#c8e86a', '#e86a5a'][d.k]); ctx.restore();
    }
  } else {
    for (j = 0; j < 5; j++){
      d = deco[j]; x = -offX + wrap(d.x * (viewW + 400) + t * 14, viewW + 400) - 200;
      y = wrap(d.y * (H + 400) - dist * 0.35, H + 400) - 200;
      ctx.globalAlpha = 0.75; ell(ctx, x, y, 130, 50, '#fff'); ell(ctx, x + 80, y + 16, 96, 38, '#fff'); ell(ctx, x - 70, y + 18, 90, 34, '#fff'); ctx.globalAlpha = 1;
    }
    for (j = 5; j < 36; j++){
      d = deco[j]; x = -offX + wrap(d.x * viewW + 50 * Math.sin(t + d.p), viewW);
      y = wrap(d.y * (H + 80) - dist * 0.6 + t * 40, H + 80) - 40;
      ctx.save(); ctx.translate(x, y); ctx.rotate(t * (0.8 + d.r) + d.p);
      ell(ctx, 0, 0, 14, 8, ['#ff9fbd', '#ffc2d4', '#fff', '#ffb3a0'][d.k]); ctx.restore();
    }
  }
}
function drawGround(t){
  var p = easeOut(landT / 1.3), j, gy = H * 0.3 + 96 + (1 - p) * (H * 0.7 + 200);
  ctx.fillStyle = '#8fd67a'; ctx.beginPath(); ctx.ellipse(W / 2, gy + 1400, viewW * 2.2, 1412, 0, 0, TAU); ctx.fill(); ctx.fillRect(-offX, gy + 60, viewW, H);
  for (j = 0; j < 44; j++){
    var d = deco[j], x = -offX + d.x * viewW, y = gy + 26 + d.y * 420, r = 16 + d.r * 12;
    if (Math.abs(x - px) < 90 && y < gy + 90) continue;
    line(ctx, x, y, x, y + 34, '#4e9c58', 5);
    for (var q = 0; q < 5; q++){
      var a = q * TAU / 5 + Math.sin(t * 2 + d.p) * 0.2;
      ell(ctx, x + Math.cos(a) * r * 0.7, y + Math.sin(a) * r * 0.7, r * 0.55, r * 0.55, ['#ff8fb1', '#fff', '#ffd166', '#c9a0ff'][d.k]);
    }
    ell(ctx, x, y, r * 0.4, r * 0.4, '#ffb347');
  }
  return gy;
}

// ---------- おじゃまもの ----------
function face(x, y, s, angry){
  ell(ctx, x - 16 * s, y, 5 * s, 6.5 * s, INK); ell(ctx, x + 16 * s, y, 5 * s, 6.5 * s, INK);
  if (angry){ line(ctx, x - 26 * s, y - 15 * s, x - 8 * s, y - 9 * s, INK, 4.5); line(ctx, x + 26 * s, y - 15 * s, x + 8 * s, y - 9 * s, INK, 4.5); }
  ctx.beginPath(); ctx.arc(x, y + 18 * s, 8 * s, Math.PI * 1.1, Math.PI * 1.9); ctx.strokeStyle = INK; ctx.lineWidth = 4.5; ctx.stroke();
}
function drawObs(o, t){
  var x = o.x, y = o.y, j, a;
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (o.kind === 0){            // かみなりぐも
    y += 5 * Math.sin(t * 2 + o.p);
    var lumps = [[-44, 6, 34], [0, -18, 44], [46, 4, 36], [0, 18, 46]];
    for (j = 0; j < 4; j++) ell(ctx, x + lumps[j][0], y + lumps[j][1], lumps[j][2] + 6, lumps[j][2] * 0.8 + 6, INK);
    for (j = 0; j < 4; j++) ell(ctx, x + lumps[j][0], y + lumps[j][1], lumps[j][2], lumps[j][2] * 0.8, '#8d8bb8');
    face(x, y + 2, 1.15, true);
    poly(ctx, [[x - 8, y + 50], [x + 14, y + 50], [x + 2, y + 72], [x + 16, y + 72], [x - 12, y + 106], [x - 4, y + 80], [x - 16, y + 80]], GOLD, INK, 4);
  } else if (o.kind === 1){     // くらげ
    x += 14 * Math.sin(t * 1.6 + o.p);
    for (j = -2; j <= 2; j++){
      ctx.beginPath(); ctx.moveTo(x + j * 18, y + 10);
      ctx.quadraticCurveTo(x + j * 18 + 12 * Math.sin(t * 4 + j), y + 44, x + j * 18, y + 74 + (j % 2) * 10);
      ctx.strokeStyle = '#ff9ec4'; ctx.lineWidth = 8; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(x, y + 6, 56, Math.PI, 0); ctx.quadraticCurveTo(x, y + 30, x - 56, y + 6); ctx.closePath();
    ctx.fillStyle = '#ffc3da'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 6; ctx.stroke();
    face(x, y - 20, 1.1, false);
  } else if (o.kind === 2){     // いがぐり
    ctx.save(); ctx.translate(x, y); ctx.rotate(t * 1.2 + o.p);
    star(ctx, 0, 0, 62, 0, '#8a5a34', INK, 6, 14, 0.72);
    ctx.restore(); ell(ctx, x, y, 38, 38, '#a8703f'); face(x, y - 4, 1.05, true);
  } else {                      // はち
    y += 10 * Math.sin(t * 5 + o.p);
    var dir = o.vx > 0 ? 1 : -1;
    ctx.globalAlpha = 0.7; ell(ctx, x - dir * 8, y - 40, 22, 30 + 6 * Math.sin(t * 40), '#eaf6ff', INK, 4); ell(ctx, x + dir * 18, y - 38, 18, 26 + 6 * Math.cos(t * 40), '#eaf6ff', INK, 4); ctx.globalAlpha = 1;
    ell(ctx, x, y, 52, 40, '#ffd24a', INK, 6);
    ctx.save(); ctx.beginPath(); ctx.ellipse(x, y, 49, 37, 0, 0, TAU); ctx.clip();
    ctx.fillStyle = INK; ctx.fillRect(x - dir * 34 - 8, y - 45, 16, 90); ctx.fillRect(x - dir * 6 - 8, y - 45, 16, 90); ctx.restore();
    face(x + dir * 26, y - 4, 0.8, false);
  }
}

// ---------- かく ----------
function banner(text, a){
  ctx.save(); ctx.globalAlpha = a; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 64px ' + FONT; ctx.lineWidth = 12; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
  ctx.strokeText(text, W / 2, H * 0.15); ctx.fillStyle = INK; ctx.fillText(text, W / 2, H * 0.15); ctx.restore();
}
function render(){
  var t = clock, i, o;
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, offX * scale * dpr, 0);
  var sx = shake > 0 ? Math.sin(t * 70) * 14 * shake / 0.35 : 0;
  ctx.save(); ctx.translate(sx, 0);
  drawBg(state === 'title' ? 0 : chIdx, t);
  if (state === 'title'){ dist += 0.6; ctx.restore(); return; }
  var py = H * 0.3, landing = time >= TOTAL, gy = 0;
  if (landing) gy = drawGround(t);
  for (i = 0; i < objs.length; i++){
    o = objs[i];
    if (o.type === 'obs') drawObs(o, t);
    else if (o.type === 'big'){
      var hue = (t * 160) % 360;
      star(ctx, o.x, o.y, 54 + 4 * Math.sin(t * 6), t * 1.5, 'hsl(' + hue + ',95%,68%)', '#fff', 7);
      star(ctx, o.x, o.y, 24, -t * 2, '#fff');
    } else star(ctx, o.x, o.y + 4 * Math.sin(t * 4 + o.p), 34, Math.sin(t * 2 + o.p) * 0.3, GOLD, INK, 5);
  }
  for (i = 0; i < parts.length; i++){
    o = parts[i]; ctx.globalAlpha = clamp(o.life / o.max * 1.5, 0, 1);
    star(ctx, o.x, o.y, o.r, o.life * 6, o.col, o.r > 16 ? INK : null, 4); ctx.globalAlpha = 1;
  }
  // じぶん
  var blink = invuln > 0 && Math.floor(t * 14) % 2 === 0;
  if (!blink || invuln > 1.2){
    var landed = landing && landT > 1.25, yy = py, sq = 0;
    if (landed){ var q = landT - 1.25; yy = py - 46 * Math.abs(Math.sin(q * 7)) * Math.exp(-q * 3); }
    drawChara(ctx, kind, px, yy, 0.44, t, {
      fall: !landed, rot: landed ? 0 : clamp(pvx / 1400, -0.45, 0.45) + (invuln > 1.2 ? (1.7 - invuln) * 12.5 : 0),
      eyes: invuln > 0.9 ? 'hurt' : (happy > 0 || landed) ? 'happy' : 'normal', mouth: landed ? 'w' : 'open', arms: landed ? 'wave' : 'up'
    });
  }
  ctx.restore();
  // ページ
  if (page){
    var p = page.t, x0 = p < 0.5 ? W + offX - (viewW + 40) * easeOut(p * 2) : -offX - (viewW + 40) * easeOut((p - 0.5) * 2) * 1.0;
    if (p >= 0.5) x0 = -offX - (viewW + 60) * Math.pow((p - 0.5) * 2, 3);
    ctx.fillStyle = 'rgba(58,46,66,.25)'; ctx.fillRect(x0 - 18, 0, viewW + 60, H);
    ctx.fillStyle = PAPER; ctx.fillRect(x0, 0, viewW + 40, H);
    ctx.save(); ctx.translate(x0 + offX, 0); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#e2703a'; ctx.font = 'bold 40px ' + FONT; ctx.fillText('だい ' + (page.to + 1) + ' わ', W / 2, H * 0.4);
    ctx.fillStyle = INK; ctx.font = 'bold 76px ' + FONT; ctx.fillText(CH[page.to].name, W / 2, H * 0.5);
    star(ctx, W / 2 - 150, H * 0.6, 22, t, GOLD, INK, 4); star(ctx, W / 2, H * 0.6, 22, -t, GOLD, INK, 4); star(ctx, W / 2 + 150, H * 0.6, 22, t, GOLD, INK, 4);
    ctx.restore();
  }
  if (landing && landT > 1.6) banner('とうちゃく！', clamp((landT - 1.6) * 3, 0, 1));
  // うえの ひょうじ
  ctx.save();
  var hx = -offX + 18, hy = 20;
  ctx.globalAlpha = 0.9; rrect(ctx, hx, hy, 190, 68, 34); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.stroke(); ctx.globalAlpha = 1;
  star(ctx, hx + 40, hy + 34, 24, 0, GOLD, INK, 4);
  ctx.fillStyle = INK; ctx.font = 'bold 40px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(String(stars), hx + 76, hy + 37);
  for (i = 0; i < 4; i++){
    var cx = W / 2 - 66 + i * 44, done = i < chIdx || landing, now = i === chIdx && !landing;
    ell(ctx, cx, hy + 34, now ? 15 : 11, now ? 15 : 11, done ? GOLD : now ? '#fff' : 'rgba(255,255,255,.45)', INK, 4);
  }
  if (hintT > 0 && !page){
    ctx.globalAlpha = clamp(hintT, 0, 1); ctx.textAlign = 'center'; ctx.font = 'bold 34px ' + FONT;
    ctx.lineWidth = 9; ctx.strokeStyle = 'rgba(58,46,66,.85)'; ctx.lineJoin = 'round';
    ctx.strokeText('ゆびで なぞって うごかそう', W / 2, H - 110); ctx.fillStyle = '#fff'; ctx.fillText('ゆびで なぞって うごかそう', W / 2, H - 110);
    var ax = W / 2 + 120 * Math.sin(t * 2.4);
    ell(ctx, ax, H - 190, 26, 26, 'rgba(255,255,255,.85)', INK, 5);
  }
  ctx.restore();
}

// ---------- うごかしかた ----------
function setTarget(clientX){ tx = clamp(clientX / scale - offX, 60, W - 60); }
cv.addEventListener('touchstart', function(e){ e.preventDefault(); audioOn(); setTarget(e.touches[0].clientX); }, { passive: false });
cv.addEventListener('touchmove', function(e){ e.preventDefault(); setTarget(e.touches[0].clientX); }, { passive: false });
var mouseDown = false;
cv.addEventListener('mousedown', function(e){ mouseDown = true; setTarget(e.clientX); });
window.addEventListener('mousemove', function(e){ if (mouseDown || state === 'play') setTarget(e.clientX); });
window.addEventListener('mouseup', function(){ mouseDown = false; });
var keys = {};
window.addEventListener('keydown', function(e){ keys[e.key] = true; });
window.addEventListener('keyup', function(e){ keys[e.key] = false; });
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

var picks = document.querySelectorAll('.pick button');
for (var bi = 0; bi < picks.length; bi++) picks[bi].addEventListener('click', function(){ startGame(this.getAttribute('data-kind')); });
document.getElementById('again').addEventListener('click', function(){ startGame(kind); });
document.getElementById('change').addEventListener('click', function(){
  state = 'title'; document.getElementById('end').hidden = true; document.getElementById('title').hidden = false;
});

// ---------- まわす ----------
var last = 0, slow = 0, pf = document.getElementById('pFox').getContext('2d'), pc = document.getElementById('pCat').getContext('2d');
function portraits(t){
  pf.clearRect(0, 0, 300, 300); pc.clearRect(0, 0, 300, 300);
  drawChara(pf, 'fox', 140, 150 + 5 * Math.sin(t * 3), 0.56, t, { arms: 'wave', eyes: 'normal', mouth: 'w' });
  drawChara(pc, 'cat', 140, 150 + 5 * Math.sin(t * 3 + 1), 0.56, t + 1.3, { arms: 'wave', eyes: 'normal', mouth: 'w' });
}
function loop(now){
  requestAnimationFrame(loop);
  var dt = (now - last) / 1000; last = now;
  if (!(dt > 0) || dt > 0.25) dt = 0.016;          // タブを はなれて いたとき
  if (dt > 0.05) dt = 0.05;
  if (state === 'play'){
    if (keys.ArrowLeft) tx = clamp(tx - 700 * dt, 60, W - 60);
    if (keys.ArrowRight) tx = clamp(tx + 700 * dt, 60, W - 60);
    slow = dt > 0.03 ? slow + 1 : Math.max(0, slow - 1);
    if (slow > 90 && quality > 1){ quality = 1; slow = 0; resize(); }   // おもい たんまつは がしつを さげる
  }
  update(dt); render();
  if (state === 'title') portraits(clock);
}
document.addEventListener('visibilitychange', function(){ if (!document.hidden) last = performance.now(); });
requestAnimationFrame(function(now){ last = now; loop(now); });

// かくにんよう（あそびには つかわない）
window.__ehon = { skip: function(sec){ time = sec; }, get: function(){ return { state: state, time: time, stars: stars, ch: chIdx, objs: objs.length }; } };
})();
</script>
