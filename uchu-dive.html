<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宇宙ダイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --space:#070515; --cyan:#7FE8F5; --pink:#F48FB8; --lilac:#C9B6FF; --cream:#FFF3DC; --shade:rgba(7,5,21,.72);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --space:#060412; } }
:root[data-theme="dark"]{ --space:#060412; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
html,body{ height:100%; margin:0; }
*,*::before,*::after{ box-sizing:inherit; }
body{
  background:var(--space); color:var(--cream); overflow:hidden;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  -webkit-user-select:none; user-select:none; touch-action:none;
}
.stage{ position:relative; width:100%; height:100%; }
canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.hud{ position:absolute; top:10px; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:0 16px; pointer-events:none; }
.depth{ font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif; font-size:1.8rem; color:var(--cyan); text-shadow:0 2px 10px rgba(0,0,0,.6); }
.depth small{ font-size:.9rem; margin-left:4px; }
.snd{ pointer-events:auto; background:rgba(255,255,255,.12); color:var(--cream); border:0; border-radius:999px; width:44px; height:44px; font-size:1.2rem; cursor:pointer; }
.btns{ display:flex; gap:8px; }
.btns .snd[hidden]{ display:none; }
.count{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif; font-size:5rem; color:var(--cyan); text-shadow:0 4px 18px rgba(0,0,0,.7); }
.count:empty{ display:none; }
.snd:focus-visible{ outline:3px solid var(--cyan); outline-offset:3px; }
.msg{ position:absolute; top:64px; left:0; right:0; text-align:center; font-weight:800; font-size:1.15rem; color:var(--pink); pointer-events:none; text-shadow:0 2px 10px rgba(0,0,0,.7); }
.pull{ position:absolute; inset:0; pointer-events:none; opacity:0; }
.pullArrow{ position:absolute; left:50%; top:50%; width:0; height:0; pointer-events:none; opacity:0; }
.pullArrow span{ position:absolute; left:0; top:0; transform:translate(-50%,-50%); font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif; font-size:2.4rem; color:var(--pink); text-shadow:0 0 12px rgba(244,143,184,.9); white-space:nowrap; }
.flash{ position:absolute; inset:0; background:#F48FB8; opacity:0; pointer-events:none; }
.flash.on{ animation:fl .5s ease-out; }
@keyframes fl{ from{ opacity:.7; } to{ opacity:0; } }
.overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; background:var(--shade); }
.overlay[hidden]{ display:none; }
h1{ font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif; font-weight:400; font-size:clamp(2rem,9vw,2.8rem); margin:0 0 14px; line-height:1.2; color:var(--lilac); }
.lead{ margin:0 0 22px; line-height:1.9; max-width:22em; }
button.go{
  font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif; font-size:1.2rem; color:var(--space);
  background:var(--lilac); border:0; border-radius:999px; padding:14px 38px; cursor:pointer; box-shadow:0 5px 0 #8E78D6;
}
button.go:active{ transform:translateY(3px); box-shadow:0 2px 0 #8E78D6; }
button.go:focus-visible{ outline:3px solid var(--cyan); outline-offset:4px; }
.big{ font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif; font-size:3.2rem; color:var(--cyan); margin:0; line-height:1.1; }
.rank{ font-weight:800; font-size:1.15rem; color:var(--pink); margin:10px 0 4px; }
.best{ opacity:.8; font-size:.9rem; margin:0 0 22px; }
.err{ color:var(--pink); }
.opt{ margin-top:18px; font-family:inherit; font-weight:800; font-size:.95rem; color:var(--cream); background:rgba(255,255,255,.12); border:0; border-radius:999px; padding:10px 18px; cursor:pointer; }
.opt:focus-visible{ outline:3px solid var(--cyan); outline-offset:3px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="pull" id="pull"></div>
  <div class="pullArrow" id="pullArrow"><span>≫</span></div>
  <div class="flash" id="flash"></div>
  <div class="hud">
    <div class="depth"><span id="depth">0</span><small>km</small></div>
    <div class="btns">
      <button class="snd" id="pauseBtn" aria-label="一時停止" hidden>⏸</button>
      <button class="snd" id="snd" aria-label="音のオンオフ">🔊</button>
    </div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="overlay" id="start">
    <h1>宇宙ダイブ</h1>
    <p class="lead">星雲をぬけて、惑星のそばをかすめて、どこまでも落ちていく。<br>指でなぞって、光る輪をくぐり続けよう。<br>ブラックホールのそばでは、体が引っぱられるから気をつけて。<br>音ありがおすすめ。</p>
    <button class="go" id="startBtn">飛びこむ</button>
    <button class="opt" data-lite>✨ ぴかぴか たっぷり</button>
  </div>
  <div class="count" id="count"></div>
  <div class="overlay" id="pauseOv" hidden>
    <p class="big">一時停止</p>
    <p class="best" id="pauseDepth"></p>
    <button class="go" id="resumeBtn">再開する</button>
    <button class="opt" data-lite>✨ ぴかぴか たっぷり</button>
  </div>
  <div class="overlay" id="end" hidden>
    <p class="big" id="final">0km</p>
    <p class="rank" id="rank"></p>
    <p class="best" id="best"></p>
    <button class="go" id="againBtn">もう一度飛びこむ</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  if (!window.THREE) {
    document.querySelector('#start .lead').innerHTML = '<span class="err">3Dの部品を読み込めなかった。通信状態を確認して、ページを開き直してね。</span>';
    return;
  }
  const stage = document.getElementById('stage');
  const cv = document.getElementById('cv');
  const depthEl = document.getElementById('depth');
  const msgEl = document.getElementById('msg');
  const flashEl = document.getElementById('flash');
  const pullEl = document.getElementById('pull');
  const arrowEl = document.getElementById('pullArrow');
  const startOv = document.getElementById('start');
  const endOv = document.getElementById('end');
  const pauseOv = document.getElementById('pauseOv');
  const pauseBtn = document.getElementById('pauseBtn');
  const countEl = document.getElementById('count');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const LIM = 5.2; // how far the player can drift from the center
  const BG = 0x070515;
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(BG);
  scene.fog = new THREE.Fog(BG, 40, 300);
  const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 600);

  scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  const sun = new THREE.DirectionalLight(0xfff3e0, 1.1);
  sun.position.set(1, 0.8, 0.6);
  scene.add(sun);

  // ---------- textures drawn in code ----------
  function cloudTexture(rgb) {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d');
    for (let i = 0; i < 9; i++) {
      const x = 70 + Math.random() * 116, y = 70 + Math.random() * 116, r = 50 + Math.random() * 70;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, `rgba(${rgb},0.35)`);
      gr.addColorStop(1, `rgba(${rgb},0)`);
      g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
    }
    return new THREE.CanvasTexture(c);
  }
  function planetTexture(cols) {
    const c = document.createElement('canvas'); c.width = 256; c.height = 128;
    const g = c.getContext('2d');
    let y = 0;
    while (y < 128) {
      const h = 4 + Math.random() * 16;
      g.fillStyle = cols[Math.floor(Math.random() * cols.length)];
      g.fillRect(0, y, 256, h + 1); y += h;
    }
    g.globalAlpha = 0.25;
    for (let i = 0; i < 40; i++) {
      g.fillStyle = cols[Math.floor(Math.random() * cols.length)];
      g.fillRect(Math.random() * 256, Math.random() * 128, 20 + Math.random() * 60, 1 + Math.random() * 2);
    }
    g.globalAlpha = 1;
    return new THREE.CanvasTexture(c);
  }
  const NEB_COLORS = ['244,143,184', '160,120,255', '110,200,240', '255,170,120'];
  const PLANET_SETS = [
    ['#F4BC7E', '#E39A86', '#C98592', '#F8D9A8'],
    ['#8FD3E8', '#6A9BD8', '#B9A7F2', '#DDF3FA'],
    ['#E8C9F2', '#F48FB8', '#8A6FA3', '#F6E3F5'],
    ['#A7E0B5', '#6FBF9A', '#E9F5C9', '#4E9C8A']
  ];

  // ---------- far backdrop: fixed stars and big nebulae that ride with the camera ----------
  const backdrop = new THREE.Group();
  scene.add(backdrop);
  {
    const N = 1400, pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
      pos[i * 3] = s * Math.cos(t) * 480; pos[i * 3 + 1] = s * Math.sin(t) * 480; pos[i * 3 + 2] = u * 480;
    }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    backdrop.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, fog: false, transparent: true, opacity: 0.8 })));
    const far = [[-120, 60, 0], [140, -40, 1], [20, 110, 3], [-60, -120, 2]];
    for (const [x, y, ci] of far) {
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTexture(NEB_COLORS[ci]), blending: THREE.AdditiveBlending, depthWrite: false, fog: false, transparent: true, opacity: 0.75 }));
      sp.position.set(x, y, -420); sp.scale.set(420, 420, 1); backdrop.add(sp);
    }
  }

  // ---------- streaking stars (the main sense of speed) ----------
  const S_N = 650;
  const sPos = new Float32Array(S_N * 6);
  const sCol = new Float32Array(S_N * 6);
  const sBase = new Float32Array(S_N * 3);
  function seedStar(i, z) {
    const a = Math.random() * Math.PI * 2, r = 1.5 + Math.pow(Math.random(), 1.6) * 45;
    sBase[i * 3] = Math.cos(a) * r; sBase[i * 3 + 1] = Math.sin(a) * r; sBase[i * 3 + 2] = z;
  }
  for (let i = 0; i < S_N; i++) {
    seedStar(i, -Math.random() * 320);
    const tint = Math.random() < 0.2 ? [0.8, 0.9, 1] : Math.random() < 0.2 ? [1, 0.85, 0.9] : [1, 1, 1];
    sCol.set(tint, i * 6); sCol.set([0.03, 0.02, 0.08], i * 6 + 3);
  }
  const sGeo = new THREE.BufferGeometry();
  sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
  sGeo.setAttribute('color', new THREE.BufferAttribute(sCol, 3));
  scene.add(new THREE.LineSegments(sGeo, new THREE.LineBasicMaterial({ vertexColors: true })));

  // ---------- nearby nebula wisps you fly through ----------
  const wisps = [];
  function placeWisp(w, z) {
    const a = Math.random() * Math.PI * 2, r = 14 + Math.random() * 30;
    w.position.set(Math.cos(a) * r, Math.sin(a) * r, z);
    const s = 40 + Math.random() * 40; w.scale.set(s, s, 1);
  }
  for (let i = 0; i < 7; i++) {
    const w = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTexture(NEB_COLORS[i % NEB_COLORS.length]), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.55 }));
    placeWisp(w, -Math.random() * 320); scene.add(w); wisps.push(w);
  }

  // ---------- planets drifting past ----------
  let planets = [];
  function makePlanet(z) {
    const r = 6 + Math.random() * 14;
    const cols = PLANET_SETS[Math.floor(Math.random() * PLANET_SETS.length)];
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 36, 24), new THREE.MeshLambertMaterial({ map: planetTexture(cols) }));
    const grp = new THREE.Group(); grp.add(mesh);
    if (Math.random() < 0.45) {
      const ring = new THREE.Mesh(new THREE.RingGeometry(r * 1.35, r * 2.0, 64), new THREE.MeshBasicMaterial({ color: cols[3], side: THREE.DoubleSide, transparent: true, opacity: 0.45 }));
      ring.rotation.x = 1.1 + Math.random() * 0.4; ring.rotation.y = Math.random() * 0.6;
      grp.add(ring);
    }
    const a = Math.random() * Math.PI * 2, d = r + 9 + Math.random() * 22;
    grp.position.set(Math.cos(a) * d, Math.sin(a) * d, z);
    grp.userData.spin = (Math.random() - 0.5) * 0.4;
    grp.rotation.z = Math.random() * 0.5;
    scene.add(grp); planets.push(grp);
  }
  function disposeGroup(g) {
    scene.remove(g);
    g.children.forEach(c => { c.geometry.dispose(); if (c.material.map) c.material.map.dispose(); c.material.dispose(); });
  }

  // ---------- black holes (pull you toward them) ----------
  function diskTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const g = c.getContext('2d'), m = 256;
    const gr = g.createRadialGradient(m, m, 0, m, m, m);
    gr.addColorStop(0.00, 'rgba(0,0,0,0)');
    gr.addColorStop(0.38, 'rgba(0,0,0,0)');
    gr.addColorStop(0.42, 'rgba(255,250,235,1)');
    gr.addColorStop(0.52, 'rgba(255,200,130,0.95)');
    gr.addColorStop(0.68, 'rgba(244,143,184,0.7)');
    gr.addColorStop(0.85, 'rgba(160,120,255,0.35)');
    gr.addColorStop(1.00, 'rgba(160,120,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
    // swirling streaks
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 70; i++) {
      const r = m * (0.44 + Math.random() * 0.48), a0 = Math.random() * Math.PI * 2;
      g.strokeStyle = `rgba(255,${200 + Math.floor(Math.random() * 55)},${180 + Math.floor(Math.random() * 75)},${0.08 + Math.random() * 0.18})`;
      g.lineWidth = 1 + Math.random() * 3;
      g.beginPath(); g.arc(m, m, r, a0, a0 + 0.4 + Math.random() * 1.4); g.stroke();
    }
    return new THREE.CanvasTexture(c);
  }
  function glowTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, 'rgba(255,190,150,0.9)');
    gr.addColorStop(0.35, 'rgba(244,143,184,0.35)');
    gr.addColorStop(1, 'rgba(160,120,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
    return new THREE.CanvasTexture(c);
  }
  let DISK_TEX = null, GLOW_TEX = null; // made once, shared by every black hole
  let holes = [];
  function makeHole(z) {
    if (!DISK_TEX) { DISK_TEX = diskTexture(); GLOW_TEX = glowTexture(); }
    const r = 3.5 + Math.random() * 2.5;
    const grp = new THREE.Group();
    // soft glow behind everything
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW_TEX, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.9 }));
    glow.scale.set(r * 9, r * 9, 1); grp.add(glow);
    // the hole itself: pure black, hides what is behind it
    grp.add(new THREE.Mesh(new THREE.SphereGeometry(r, 40, 28), new THREE.MeshBasicMaterial({ color: 0x000000 })));
    // tilted accretion disk
    const disk = new THREE.Mesh(new THREE.RingGeometry(r * 1.5, r * 4.2, 64, 1),
      new THREE.MeshBasicMaterial({ map: DISK_TEX, side: THREE.DoubleSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
    disk.rotation.x = 1.25 + Math.random() * 0.25; disk.rotation.y = (Math.random() - 0.5) * 0.4;
    grp.add(disk);
    // bright ring hugging the edge (the "bent light" look), always facing us
    const halo = new THREE.Mesh(new THREE.RingGeometry(r * 1.02, r * 1.6, 64, 1),
      new THREE.MeshBasicMaterial({ map: DISK_TEX, side: THREE.DoubleSide, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.85 }));
    grp.add(halo);
    const a = Math.random() * Math.PI * 2, d = r * 4.2 + 8 + Math.random() * 10;
    grp.position.set(Math.cos(a) * d, Math.sin(a) * d, z);
    grp.rotation.z = Math.random() * Math.PI;
    grp.userData = { disk, warned: false, r };
    scene.add(grp); holes.push(grp);
  }
  function disposeHole(h) {
    scene.remove(h);
    h.children.forEach(c => {
      if (!c.isSprite) c.geometry.dispose(); // sprites share one geometry, leave it alone
      c.material.dispose(); // textures are shared, keep them
    });
  }

  // ---------- fireworks ----------
  const FW_N = 4000;
  const fwPos = new Float32Array(FW_N * 3), fwCol = new Float32Array(FW_N * 3);
  const fwVel = new Float32Array(FW_N * 3), fwBase = new Float32Array(FW_N * 3);
  const fwLife = new Float32Array(FW_N), fwMax = new Float32Array(FW_N), fwGrav = new Float32Array(FW_N);
  const fwGlit = new Uint8Array(FW_N);
  let fwNext = 0, fwAlive = 0;
  for (let i = 0; i < FW_N; i++) fwPos[i * 3 + 2] = 999;
  const fwGeo = new THREE.BufferGeometry();
  fwGeo.setAttribute('position', new THREE.BufferAttribute(fwPos, 3));
  fwGeo.setAttribute('color', new THREE.BufferAttribute(fwCol, 3));
  function dotTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,0.8)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }
  const DOT_TEX = dotTexture();
  const fwPoints = new THREE.Points(fwGeo, new THREE.PointsMaterial({ size: 1.25, map: DOT_TEX, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  fwPoints.frustumCulled = false;
  scene.add(fwPoints);
  // a big soft flash where each firework opens
  const fwFlashes = [];
  for (let i = 0; i < 8; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: DOT_TEX, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0 }));
    sp.userData.t = 0; scene.add(sp); fwFlashes.push(sp);
  }
  let fwFlashNext = 0;
  // saturated colors so overlapping sparks stay colorful instead of turning white
  const FWC = { pink: [1, 0.22, 0.55], cyan: [0.2, 0.8, 1], gold: [1, 0.62, 0.12], lilac: [0.62, 0.38, 1], mint: [0.3, 1, 0.6], white: [0.9, 0.85, 0.8] };
  const FW_PALETTES = [
    [FWC.pink], [FWC.cyan], [FWC.gold], [FWC.lilac], [FWC.mint],
    [FWC.pink, FWC.cyan, FWC.gold],
    [FWC.gold, FWC.pink, FWC.lilac],
    [FWC.cyan, FWC.mint, FWC.lilac]
  ];
  function spark(x, y, z, vx, vy, vz, c, life, grav, glit) {
    const i = fwNext; fwNext = (fwNext + 1) % FW_N;
    fwPos[i * 3] = x; fwPos[i * 3 + 1] = y; fwPos[i * 3 + 2] = z;
    fwVel[i * 3] = vx; fwVel[i * 3 + 1] = vy; fwVel[i * 3 + 2] = vz;
    fwBase[i * 3] = c[0]; fwBase[i * 3 + 1] = c[1]; fwBase[i * 3 + 2] = c[2];
    fwLife[i] = fwMax[i] = life; fwGrav[i] = grav; fwGlit[i] = glit ? 1 : 0;
  }
  // kind: 'peony' ball, 'ring', 'willow' drooping gold, 'heart'
  function firework(x, y, z, kind, pal, scale) {
    scale = scale || 1;
    const amount = Math.round((kind === 'heart' ? 150 : kind === 'ring' ? 110 : 190) * (lite ? 0.5 : 1) * Math.min(1, scale));
    const glit = Math.random() < 0.4;
    const sp = 13 * scale;
    // tilt for rings
    const ta = Math.random() * Math.PI, tb = Math.random() * Math.PI;
    for (let k = 0; k < amount; k++) {
      const c = pal[k % pal.length];
      let vx, vy, vz, life = 1.5 + Math.random() * 0.8, grav = 2.5;
      if (kind === 'heart') {
        const t = (k / amount) * Math.PI * 2;
        const hx = 16 * Math.pow(Math.sin(t), 3) / 17;
        const hy = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 17;
        const m = sp * (0.92 + Math.random() * 0.08);
        vx = hx * m; vy = hy * m; vz = (Math.random() - 0.5) * 1.5; grav = 1.2;
      } else if (kind === 'ring') {
        const t = (k / amount) * Math.PI * 2, m = sp * (0.95 + Math.random() * 0.05);
        let rx = Math.cos(t) * m, ry = Math.sin(t) * m, rz = 0;

  function randomFirework() {

  function updateFireworks(dt, dz) {

  // ---------- gates you must pass through ----------
  let gates = [];
  const GATE_COLS = [0x7FE8F5, 0xF48FB8, 0xC9B6FF];
  function makeGate(z, t) {
    const hr = Math.max(1.5, 2.7 - t * 0.022);
    const a = Math.random() * Math.PI * 2, rr = Math.random() * Math.max(0, LIM - hr + 0.6);
    const hx = Math.cos(a) * rr, hy = Math.sin(a) * rr;
    const col = GATE_COLS[Math.floor(Math.random() * GATE_COLS.length)];
    const grp = new THREE.Group();
    // soft colored glow behind the ring
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: DOT_TEX, color: col, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.5 }));
    glow.scale.set(hr * 3.2, hr * 3.2, 1); grp.add(glow);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(hr, 0.16, 8, 56), new THREE.MeshBasicMaterial({ color: col }));
    grp.add(ring);
    const inner = new THREE.Mesh(new THREE.CircleGeometry(hr, 48), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false }));
    grp.add(inner);
    const outer = new THREE.Mesh(new THREE.TorusGeometry(hr + 0.55, 0.05, 6, 56), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.5 }));
    grp.add(outer);

    }

  }

  // ---------- sound ----------
  let actx = null, noiseBuf = null, bp = null, windGain = null, rumbleGain = null, soundOn = true;
  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const len = actx.sampleRate * 2;
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = actx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8; bp.frequency.value = 300;
      windGain = actx.createGain(); windGain.gain.value = 0;
      src.connect(bp); bp.connect(windGain); windGain.connect(actx.destination);
      src.start();
      // low rumble that swells near a black hole
      const ro = actx.createOscillator(); ro.type = 'triangle'; ro.frequency.value = 72;
      const ro2 = actx.createOscillator(); ro2.type = 'sine'; ro2.frequency.value = 79;
      const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 320;
      rumbleGain = actx.createGain(); rumbleGain.gain.value = 0;
      ro.connect(lp); ro2.connect(lp); lp.connect(rumbleGain); rumbleGain.connect(actx.destination);

  }
  function chime() {
    if (!actx || !soundOn) return;

      const o = actx.createOscillator(), g = actx.createGain();

      g.gain.setValueAtTime(0, t + i * 0.05); g.gain.linearRampToValueAtTime(0.12, t + i * 0.05 + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.05 + 0.5);

  let lite = false;

  function applyLite() {

  let state = 'idle', speed = 10, depth = 0, elapsed = 0, untilGate = 70, untilPlanet = 40, untilHole = 160, untilFire = 0, fireLeft = 0, fireBurst = 0, msgUntil = 0, clock = 0;
  const pl = { x: 0, y: 0, tx: 0, ty: 0, vx: 0 };

  }

  }

    gates = gates.filter(g => { if (g.position.z > 8) { disposeGate(g); return false; } return true; });

    if (msgUntil && clock > msgUntil) { msgEl.textContent = ''; msgUntil = 0; }
    depthEl.textContent = Math.floor(depth);

    {
      const k = Math.min(1, pullMax / 2.2);
      if (k > 0.05) {
        const ex = 50 + pullX * 55, ey = 50 - pullY * 55; // screen y is flipped
        pullEl.style.background = `radial-gradient(circle at ${ex}% ${ey}%, rgba(244,143,184,.8), rgba(160,120,255,.35) 38%, transparent 68%)`;
        pullEl.style.opacity = k.toFixed(2);
        const w = stage.clientWidth, h = stage.clientHeight, rad = Math.min(w, h) * 0.3;
        arrowEl.style.transform = `translate(${pullX * rad}px, ${-pullY * rad}px) rotate(${Math.atan2(-pullY, pullX)}rad)`;
        arrowEl.style.opacity = Math.min(1, k * 1.4).toFixed(2);
      } else { pullEl.style.opacity = 0; arrowEl.style.opacity = 0; }
    }
    const shake = reduceMotion ? 0 : Math.max(0, speed - 24) * 0.002 + pullMax * 0.02;
    camera.position.set(pl.x + (Math.random() - 0.5) * shake, pl.y + (Math.random() - 0.5) * shake, 0);
    camera.rotation.set(0, 0, reduceMotion ? 0 : Math.max(-0.35, Math.min(0.35, -pl.vx * 0.02)));
    backdrop.position.copy(camera.position);
    const fov = 68 + Math.max(0, speed - 18) * 0.5;
    if (Math.abs(camera.fov - fov) > 0.05) { camera.fov += (fov - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix(); }

    if (windGain && actx) {
      const target = soundOn && state === 'play' ? Math.min(0.22, 0.03 + (speed - 18) * 0.004) : 0;
      windGain.gain.setTargetAtTime(target, actx.currentTime, 0.2);
      bp.frequency.setTargetAtTime(250 + speed * 14, actx.currentTime, 0.25);
    }
    if (rumbleGain && actx) {
      rumbleGain.gain.setTargetAtTime(soundOn ? Math.min(0.5, pullMax * 0.16) : 0, actx.currentTime, 0.3);
    }

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('againBtn').addEventListener('click', start);
})();
</script>
</body>
</html>
