<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宇宙ダイブ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --space:#070515; --cyan:#7FE8F5; --pink:#F48FB8; --lilac:#C9B6FF; --cream:#FFF3DC; --shade:rgba(7,5,21,.72);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --space:#060412; } }
:root[data-theme="dark"]{ --space:#060412; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
html,body{ height:100%; margin:0; }
*,*::before,*::after{ box-sizing:inherit; }
body{
  background:var(--space); color:var(--cream); overflow:hidden;
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  -webkit-user-select:none; user-select:none; touch-action:none;
}
.stage{ position:relative; width:100%; height:100%; }
canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
.hud{ position:absolute; top:10px; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:0 16px; pointer-events:none; }
.depth{ font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif; font-size:1.8rem; color:var(--cyan); text-shadow:0 2px 10px rgba(0,0,0,.6); }
.depth small{ font-size:.9rem; margin-left:4px; }
.snd{ pointer-events:auto; background:rgba(255,255,255,.12); color:var(--cream); border:0; border-radius:999px; width:44px; height:44px; font-size:1.2rem; cursor:pointer; }
.snd:focus-visible{ outline:3px solid var(--cyan); outline-offset:3px; }
.msg{ position:absolute; top:64px; left:0; right:0; text-align:center; font-weight:800; font-size:1.15rem; color:var(--pink); pointer-events:none; text-shadow:0 2px 10px rgba(0,0,0,.7); }
.flash{ position:absolute; inset:0; background:#F48FB8; opacity:0; pointer-events:none; }
.flash.on{ animation:fl .5s ease-out; }
@keyframes fl{ from{ opacity:.7; } to{ opacity:0; } }
.overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; background:var(--shade); }
.overlay[hidden]{ display:none; }
h1{ font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif; font-weight:400; font-size:clamp(2rem,9vw,2.8rem); margin:0 0 14px; line-height:1.2; color:var(--lilac); }
.lead{ margin:0 0 22px; line-height:1.9; max-width:22em; }
button.go{
  font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif; font-size:1.2rem; color:var(--space);
  background:var(--lilac); border:0; border-radius:999px; padding:14px 38px; cursor:pointer; box-shadow:0 5px 0 #8E78D6;
}
button.go:active{ transform:translateY(3px); box-shadow:0 2px 0 #8E78D6; }
button.go:focus-visible{ outline:3px solid var(--cyan); outline-offset:4px; }
.big{ font-family:"Mochiy Pop One","M PLUS Rounded 1c",sans-serif; font-size:3.2rem; color:var(--cyan); margin:0; line-height:1.1; }
.rank{ font-weight:800; font-size:1.15rem; color:var(--pink); margin:10px 0 4px; }
.best{ opacity:.8; font-size:.9rem; margin:0 0 22px; }
.err{ color:var(--pink); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="flash" id="flash"></div>
  <div class="hud">
    <div class="depth"><span id="depth">0</span><small>km</small></div>
    <button class="snd" id="snd" aria-label="音のオンオフ">🔊</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="overlay" id="start">
    <h1>宇宙ダイブ</h1>
    <p class="lead">星雲をぬけて、惑星のそばをかすめて、どこまでも落ちていく。<br>指でなぞって、光る輪をくぐり続けよう。<br>音ありがおすすめ。</p>
    <button class="go" id="startBtn">飛びこむ</button>
  </div>
  <div class="overlay" id="end" hidden>
    <p class="big" id="final">0km</p>
    <p class="rank" id="rank"></p>
    <p class="best" id="best"></p>
    <button class="go" id="againBtn">もう一度飛びこむ</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  if (!window.THREE) {
    document.querySelector('#start .lead').innerHTML = '<span class="err">3Dの部品を読み込めなかった。通信状態を確認して、ページを開き直してね。</span>';
    return;
  }
  const stage = document.getElementById('stage');
  const cv = document.getElementById('cv');
  const depthEl = document.getElementById('depth');
  const msgEl = document.getElementById('msg');
  const flashEl = document.getElementById('flash');
  const startOv = document.getElementById('start');
  const endOv = document.getElementById('end');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const LIM = 5.2; // how far the player can drift from the center
  const BG = 0x070515;
  const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(BG);
  scene.fog = new THREE.Fog(BG, 40, 300);
  const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 600);

  scene.add(new THREE.AmbientLight(0xffffff, 0.35));
  const sun = new THREE.DirectionalLight(0xfff3e0, 1.1);
  sun.position.set(1, 0.8, 0.6);
  scene.add(sun);

  // ---------- textures drawn in code ----------
  function cloudTexture(rgb) {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const g = c.getContext('2d');
    for (let i = 0; i < 9; i++) {
      const x = 70 + Math.random() * 116, y = 70 + Math.random() * 116, r = 50 + Math.random() * 70;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, `rgba(${rgb},0.35)`);
      gr.addColorStop(1, `rgba(${rgb},0)`);
      g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
    }
    return new THREE.CanvasTexture(c);
  }
  function planetTexture(cols) {
    const c = document.createElement('canvas'); c.width = 256; c.height = 128;
    const g = c.getContext('2d');
    let y = 0;
    while (y < 128) {
      const h = 4 + Math.random() * 16;
      g.fillStyle = cols[Math.floor(Math.random() * cols.length)];
      g.fillRect(0, y, 256, h + 1); y += h;
    }
    g.globalAlpha = 0.25;
    for (let i = 0; i < 40; i++) {
      g.fillStyle = cols[Math.floor(Math.random() * cols.length)];
      g.fillRect(Math.random() * 256, Math.random() * 128, 20 + Math.random() * 60, 1 + Math.random() * 2);
    }
    g.globalAlpha = 1;
    return new THREE.CanvasTexture(c);
  }
  const NEB_COLORS = ['244,143,184', '160,120,255', '110,200,240', '255,170,120'];
  const PLANET_SETS = [
    ['#F4BC7E', '#E39A86', '#C98592', '#F8D9A8'],
    ['#8FD3E8', '#6A9BD8', '#B9A7F2', '#DDF3FA'],
    ['#E8C9F2', '#F48FB8', '#8A6FA3', '#F6E3F5'],
    ['#A7E0B5', '#6FBF9A', '#E9F5C9', '#4E9C8A']
  ];

  // ---------- far backdrop: fixed stars and big nebulae that ride with the camera ----------
  const backdrop = new THREE.Group();
  scene.add(backdrop);
  {
    const N = 1400, pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const u = Math.random() * 2 - 1, t = Math.random() * Math.PI * 2, s = Math.sqrt(1 - u * u);
      pos[i * 3] = s * Math.cos(t) * 480; pos[i * 3 + 1] = s * Math.sin(t) * 480; pos[i * 3 + 2] = u * 480;
    }
    const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    backdrop.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, fog: false, transparent: true, opacity: 0.8 })));
    const far = [[-120, 60, 0], [140, -40, 1], [20, 110, 3], [-60, -120, 2]];
    for (const [x, y, ci] of far) {
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTexture(NEB_COLORS[ci]), blending: THREE.AdditiveBlending, depthWrite: false, fog: false, transparent: true, opacity: 0.75 }));
      sp.position.set(x, y, -420); sp.scale.set(420, 420, 1); backdrop.add(sp);
    }
  }

  // ---------- streaking stars (the main sense of speed) ----------
  const S_N = 650;
  const sPos = new Float32Array(S_N * 6);
  const sCol = new Float32Array(S_N * 6);
  const sBase = new Float32Array(S_N * 3);
  function seedStar(i, z) {
    const a = Math.random() * Math.PI * 2, r = 1.5 + Math.pow(Math.random(), 1.6) * 45;
    sBase[i * 3] = Math.cos(a) * r; sBase[i * 3 + 1] = Math.sin(a) * r; sBase[i * 3 + 2] = z;
  }
  for (let i = 0; i < S_N; i++) {
    seedStar(i, -Math.random() * 320);
    const tint = Math.random() < 0.2 ? [0.8, 0.9, 1] : Math.random() < 0.2 ? [1, 0.85, 0.9] : [1, 1, 1];
    sCol.set(tint, i * 6); sCol.set([0.03, 0.02, 0.08], i * 6 + 3);
  }
  const sGeo = new THREE.BufferGeometry();
  sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
  sGeo.setAttribute('color', new THREE.BufferAttribute(sCol, 3));
  scene.add(new THREE.LineSegments(sGeo, new THREE.LineBasicMaterial({ vertexColors: true })));

  // ---------- nearby nebula wisps you fly through ----------
  const wisps = [];
  function placeWisp(w, z) {
    const a = Math.random() * Math.PI * 2, r = 14 + Math.random() * 30;
    w.position.set(Math.cos(a) * r, Math.sin(a) * r, z);
    const s = 40 + Math.random() * 40; w.scale.set(s, s, 1);
  }
  for (let i = 0; i < 7; i++) {
    const w = new THREE.Sprite(new THREE.SpriteMaterial({ map: cloudTexture(NEB_COLORS[i % NEB_COLORS.length]), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.55 }));
    placeWisp(w, -Math.random() * 320); scene.add(w); wisps.push(w);
  }

  // ---------- planets drifting past ----------
  let planets = [];
  function makePlanet(z) {
    const r = 6 + Math.random() * 14;
    const cols = PLANET_SETS[Math.floor(Math.random() * PLANET_SETS.length)];
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 36, 24), new THREE.MeshLambertMaterial({ map: planetTexture(cols) }));
    const grp = new THREE.Group(); grp.add(mesh);
    if (Math.random() < 0.45) {
      const ring = new THREE.Mesh(new THREE.RingGeometry(r * 1.35, r * 2.0, 64), new THREE.MeshBasicMaterial({ color: cols[3], side: THREE.DoubleSide, transparent: true, opacity: 0.45 }));
      ring.rotation.x = 1.1 + Math.random() * 0.4; ring.rotation.y = Math.random() * 0.6;
      grp.add(ring);
    }
    const a = Math.random() * Math.PI * 2, d = r + 9 + Math.random() * 22;
    grp.position.set(Math.cos(a) * d, Math.sin(a) * d, z);
    grp.userData.spin = (Math.random() - 0.5) * 0.4;
    grp.rotation.z = Math.random() * 0.5;
    scene.add(grp); planets.push(grp);
  }
  function disposeGroup(g) {
    scene.remove(g);
    g.children.forEach(c => { c.geometry.dispose(); if (c.material.map) c.material.map.dispose(); c.material.dispose(); });
  }

  // ---------- gates you must pass through ----------
  let gates = [];
  const GATE_COLS = [0x7FE8F5, 0xF48FB8, 0xC9B6FF];
  function makeGate(z, t) {
    const hr = Math.max(1.5, 2.7 - t * 0.022);
    const a = Math.random() * Math.PI * 2, rr = Math.random() * Math.max(0, LIM - hr + 0.6);
    const hx = Math.cos(a) * rr, hy = Math.sin(a) * rr;
    const col = GATE_COLS[Math.floor(Math.random() * GATE_COLS.length)];
    const grp = new THREE.Group();
    grp.add(new THREE.Mesh(new THREE.TorusGeometry(hr, 0.16, 8, 56), new THREE.MeshBasicMaterial({ color: col })));
    grp.add(new THREE.Mesh(new THREE.CircleGeometry(hr, 48), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false })));
    grp.add(new THREE.Mesh(new THREE.TorusGeometry(hr + 0.55, 0.05, 6, 56), new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.5 })));
    grp.position.set(hx, hy, z);
    grp.userData = { hr, passed: false };
    scene.add(grp); gates.push(grp);
  }

  // ---------- sound ----------
  let actx = null, noiseBuf = null, bp = null, windGain = null, soundOn = true;
  function initAudio() {
    if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const len = actx.sampleRate * 2;
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = actx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.8; bp.frequency.value = 300;
      windGain = actx.createGain(); windGain.gain.value = 0;
      src.connect(bp); bp.connect(windGain); windGain.connect(actx.destination);
      src.start();
    } catch (e) { actx = null; }
  }
  function chime() {
    if (!actx || !soundOn) return;
    const t = actx.currentTime;
    [880, 1320].forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + i * 0.05); g.gain.linearRampToValueAtTime(0.12, t + i * 0.05 + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.05 + 0.5);
      o.connect(g); g.connect(actx.destination); o.start(t + i * 0.05); o.stop(t + i * 0.05 + 0.55);
    });
    const s = actx.createBufferSource(); s.buffer = noiseBuf;
    const f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1500;
    const g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.25, t + 0.04); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    s.connect(f); f.connect(g); g.connect(actx.destination); s.start(t); s.stop(t + 0.4);
  }
  function thud() {
    if (!actx || !soundOn) return;
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = 'sine'; o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(35, t + 0.5);
    g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.65);
  }
  document.getElementById('snd').addEventListener('click', e => {
    soundOn = !soundOn; e.currentTarget.textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) initAudio();
  });

  // ---------- state & input ----------
  let state = 'idle', speed = 10, depth = 0, elapsed = 0, untilGate = 70, untilPlanet = 40, msgUntil = 0, clock = 0;
  const pl = { x: 0, y: 0, tx: 0, ty: 0, vx: 0 };
  const keys = {};
  let drag = null;

  function clampTarget() {
    const r = Math.hypot(pl.tx, pl.ty);
    if (r > LIM) { pl.tx *= LIM / r; pl.ty *= LIM / r; }
  }
  stage.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    drag = { x: e.clientX, y: e.clientY, tx: pl.tx, ty: pl.ty };
  });
  stage.addEventListener('pointermove', e => {
    if (!drag || state !== 'play') return;
    const k = 12 / Math.min(stage.clientWidth, stage.clientHeight);
    pl.tx = drag.tx + (e.clientX - drag.x) * k;
    pl.ty = drag.ty - (e.clientY - drag.y) * k;
    clampTarget();
  });
  const endDrag = () => { drag = null; };
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  window.addEventListener('keydown', e => { keys[e.key] = true; });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  function showMsg(t, sec) { msgEl.textContent = t; msgUntil = clock + sec; }
  function readBest() { try { return Number(localStorage.getItem('uchu-best')) || 0; } catch (e) { return 0; } }
  function saveBest(v) { try { localStorage.setItem('uchu-best', String(v)); } catch (e) {} }

  function start() {
    initAudio();
    gates.forEach(disposeGroup); gates = [];
    state = 'play'; speed = 18; depth = 0; elapsed = 0; untilGate = 70;
    pl.x = pl.y = pl.tx = pl.ty = pl.vx = 0;
    msgEl.textContent = '';
    startOv.hidden = true; endOv.hidden = true;
  }

  function crash() {
    state = 'dead'; thud();
    showMsg('輪をくぐりそこねた…', 2);
    flashEl.classList.remove('on'); void flashEl.offsetWidth; flashEl.classList.add('on');
    try { if (navigator.vibrate) navigator.vibrate(120); } catch (e) {}
    const m = Math.floor(depth);
    const best = Math.max(readBest(), m); saveBest(best);
    let rank;
    if (m < 300) rank = 'まだ月の手前';
    else if (m < 800) rank = '星雲の住人';
    else if (m < 1500) rank = '銀河の常連';
    else rank = '宇宙の果ての人';
    document.getElementById('final').textContent = m + 'km';
    document.getElementById('rank').textContent = rank;
    document.getElementById('best').textContent = 'これまでの最長 ' + best + 'km';
    setTimeout(() => { endOv.hidden = false; document.getElementById('againBtn').focus(); }, 700);
  }

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();
  makePlanet(-120); makePlanet(-260);

  // ---------- main loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now; clock += dt;

    if (state === 'play') {
      elapsed += dt;
      speed = Math.min(70, 18 + elapsed * 1.3);
      const kx = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
      const ky = (keys.ArrowUp || keys.w ? 1 : 0) - (keys.ArrowDown || keys.s ? 1 : 0);
      if (kx || ky) { pl.tx += kx * 9 * dt; pl.ty += ky * 9 * dt; clampTarget(); }
    } else if (state === 'idle') {
      speed = 12;
    } else {
      speed = Math.max(3, speed - 60 * dt);
    }

    const px = pl.x;
    pl.x += (pl.tx - pl.x) * Math.min(1, dt * 9);
    pl.y += (pl.ty - pl.y) * Math.min(1, dt * 9);
    pl.vx = (pl.x - px) / Math.max(dt, 0.001);

    const dz = speed * dt;
    if (state === 'play') depth += dz * 0.5;

    // stars: head moves forward, tail stretches with speed
    const len = 0.15 + Math.max(0, speed - 12) * 0.075;
    for (let i = 0; i < S_N; i++) {
      sBase[i * 3 + 2] += dz;
      if (sBase[i * 3 + 2] > 3) seedStar(i, -300 - Math.random() * 30);
      const x = sBase[i * 3], y = sBase[i * 3 + 1], z = sBase[i * 3 + 2];
      sPos[i * 6] = x; sPos[i * 6 + 1] = y; sPos[i * 6 + 2] = z;
      sPos[i * 6 + 3] = x; sPos[i * 6 + 4] = y; sPos[i * 6 + 5] = z - len;
    }
    sGeo.attributes.position.needsUpdate = true;

    for (const w of wisps) { w.position.z += dz; if (w.position.z > 30) placeWisp(w, -320); }

    untilPlanet -= dz;
    if (untilPlanet <= 0) { makePlanet(-320); untilPlanet = 150 + Math.random() * 120; }
    for (const p of planets) { p.position.z += dz; p.children[0].rotation.y += p.userData.spin * dt; }
    planets = planets.filter(p => { if (p.position.z > 60) { disposeGroup(p); return false; } return true; });

    if (state === 'play') {
      untilGate -= dz;
      if (untilGate <= 0) { makeGate(-170, elapsed); untilGate = Math.max(26, 48 - elapsed * 0.35); }
    }
    for (const g of gates) {
      const prev = g.position.z;
      g.position.z += dz;
      g.rotation.z += dt * 0.6;
      const u = g.userData;
      if (state === 'play' && !u.passed && prev < 0 && g.position.z >= 0) {
        u.passed = true;
        const d = Math.hypot(pl.x - g.position.x, pl.y - g.position.y);
        if (d > u.hr - 0.3) crash();
        else { chime(); if (u.hr - d < 0.55) showMsg('ギリギリ！', 0.9); }
      }
    }
    gates = gates.filter(g => { if (g.position.z > 8) { disposeGroup(g); return false; } return true; });

    if (msgUntil && clock > msgUntil) { msgEl.textContent = ''; msgUntil = 0; }
    depthEl.textContent = Math.floor(depth);

    const shake = reduceMotion ? 0 : Math.max(0, speed - 24) * 0.002;
    camera.position.set(pl.x + (Math.random() - 0.5) * shake, pl.y + (Math.random() - 0.5) * shake, 0);
    camera.rotation.set(0, 0, reduceMotion ? 0 : Math.max(-0.35, Math.min(0.35, -pl.vx * 0.02)));
    backdrop.position.copy(camera.position);
    const fov = 68 + Math.max(0, speed - 18) * 0.5;
    if (Math.abs(camera.fov - fov) > 0.05) { camera.fov += (fov - camera.fov) * Math.min(1, dt * 4); camera.updateProjectionMatrix(); }

    if (windGain && actx) {
      const target = soundOn && state === 'play' ? Math.min(0.22, 0.03 + (speed - 18) * 0.004) : 0;
      windGain.gain.setTargetAtTime(target, actx.currentTime, 0.2);
      bp.frequency.setTargetAtTime(250 + speed * 14, actx.currentTime, 0.25);
    }

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('againBtn').addEventListener('click', start);
})();
</script>
</body>
</html>
