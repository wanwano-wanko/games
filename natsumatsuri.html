<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>なつまつりごっこ</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --night1:#1b2a5e; --night2:#0d1538;
    --paper:#fff6e8; --paper2:#ffeeda;
    --lantern:#ffb74a; --lantern-glow:#ffd98a;
    --aka:#e85345; --pink:#ff7bac; --midori:#57b98b; --murasaki:#7a5ad4;
    --ink:#3a2c26;
    --coin-500:#cdbb6e; --coin-100:#c9cdd4; --coin-50:#d4d8de; --coin-10:#b87549;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;}
  body{
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDGothic",sans-serif;
    background:linear-gradient(180deg,var(--night1),var(--night2) 70%);
    color:var(--ink);
    display:flex;justify-content:center;
    overflow:hidden;
  }
  #app{
    width:100%;max-width:560px;height:100vh;height:100dvh;
    display:flex;flex-direction:column;position:relative;overflow:hidden;
  }
  /* ===== タブレット ===== */
  @media (min-width:700px){
    #app{max-width:1000px;}
    .map-grid{grid-template-columns:repeat(4,1fr) !important;}
    h2{font-size:30px !important;}
    .btn-big{font-size:24px;padding:16px 44px;}
    .wallet-bar svg{width:52px;height:52px;}
    .wcount{font-size:16px !important;}
    .pool{max-width:560px !important;}
  }
  /* ちょうちん */
  .lanterns{display:flex;justify-content:space-around;padding:6px 4px 0;flex-shrink:0;position:relative;z-index:3;}
  .lantern{width:34px;height:44px;position:relative;animation:sway 3s ease-in-out infinite;transform-origin:top center;}
  .lantern:nth-child(2n){animation-delay:1.2s;}
  .lantern:nth-child(3n){animation-delay:.6s;}
  @keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .lantern svg{filter:drop-shadow(0 0 10px rgba(255,183,74,.55));}

  /* ステータスバー(とけい+おなか) */
  #statusbar{
    display:none;align-items:center;gap:10px;
    background:rgba(255,246,232,.95);border-radius:16px;
    margin:4px 8px 0;padding:5px 12px;flex-shrink:0;z-index:4;
    box-shadow:0 3px 0 rgba(0,0,0,.25);
  }
  #statusbar.show{display:flex;}
  .clock-wrap{display:flex;align-items:center;gap:7px;}
  .clock-digit{font-weight:900;font-size:17px;line-height:1.1;}
  .clock-digit small{display:block;font-size:10px;color:#8a5a2a;font-weight:700;}
  .meter{display:flex;align-items:center;gap:6px;margin-left:auto;}
  .mface{font-size:24px;}
  .mbar{width:min(120px,22vw);height:14px;background:#e0d4c0;border-radius:8px;overflow:hidden;}
  .mbar>div{height:100%;border-radius:8px;transition:width .5s,background .5s;}
  .mlabel{font-size:11px;font-weight:900;color:#8a5a2a;}

  .screen{flex:1;display:none;flex-direction:column;overflow:hidden;position:relative;min-height:0;}
  .screen.active{display:flex;}
  h1,h2{color:var(--paper);text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.3);}
  h2{font-size:clamp(19px,5vw,26px);font-weight:900;padding:6px 0 2px;flex-shrink:0;}
  .sub{color:var(--lantern-glow);text-align:center;font-size:14px;font-weight:700;flex-shrink:0;}

  .btn{
    font-family:inherit;font-weight:900;border:none;cursor:pointer;
    border-radius:999px;color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.25);
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25);}
  .btn:disabled{opacity:.4;pointer-events:none;}
  .btn-big{font-size:20px;padding:14px 34px;background:var(--aka);}
  .btn-green{background:var(--midori);}
  .btn-pink{background:var(--pink);}
  .btn-ghost{background:rgba(255,255,255,.18);color:var(--paper);font-size:14px;padding:8px 18px;box-shadow:none;border:2px solid rgba(255,255,255,.35);}
  .urgent{animation:urgentpulse 1s infinite;}
  @keyframes urgentpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08);box-shadow:0 0 18px var(--aka);}}

  /* ====== タイトル ====== */
  #scr-title{justify-content:center;align-items:center;gap:20px;}
  #scr-title h1{font-size:clamp(34px,9vw,54px);font-weight:900;line-height:1.3;}
  #scr-title .fude{color:var(--lantern);font-size:.55em;display:block;letter-spacing:.4em;}
  .title-fireworks{position:absolute;inset:0;pointer-events:none;}

  /* ====== きせかえ ====== */
  #dress-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;}
  #dress-stage svg{height:100%;max-height:44vh;}
  .picker-area{background:var(--paper);border-radius:24px 24px 0 0;padding:10px 14px 12px;flex-shrink:0;}
  .picker-tabs{display:flex;gap:6px;margin-bottom:8px;}
  .ptab{flex:1;border:none;border-radius:999px;padding:9px 0;font-family:inherit;font-weight:900;font-size:clamp(11px,3vw,15px);background:#e9ddc9;color:#8a7a68;cursor:pointer;}
  .ptab.on{background:var(--aka);color:#fff;}
  .swatches{display:flex;gap:10px;justify-content:center;min-height:66px;align-items:center;flex-wrap:wrap;}
  .sw{width:58px;height:58px;border-radius:18px;border:4px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.15);}
  .sw.on{border-color:var(--ink);transform:scale(1.08);}
  .dress-go{display:flex;justify-content:center;padding:10px 0 2px;}

  /* ====== おこづかい&やくそく ====== */
  #scr-money{align-items:center;justify-content:flex-start;gap:10px;padding:8px 16px;overflow-y:auto;}
  .money-bubble{background:var(--paper);border-radius:22px;padding:12px 18px;font-weight:900;font-size:15px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.25);max-width:420px;}
  .mom-row{display:flex;align-items:center;gap:10px;}
  #gift-coins{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:420px;}
  .gift-coin{cursor:pointer;transition:transform .15s;animation:pop .4s;}
  .gift-coin:active{transform:scale(1.2);}
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

  /* ====== マップ ====== */
  #scr-map{padding:0 8px;}
  .map-grid{
    flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;
    padding:8px 4px;min-height:0;overflow-y:auto;align-content:start;
  }
  .stall{background:rgba(255,255,255,.06);border:none;cursor:pointer;padding:6px 4px 8px;border-radius:16px;transition:transform .1s;}
  .stall:active{transform:scale(.95);}
  .stall.soldout{opacity:.45;}
  .stall svg{width:100%;height:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));}
  .stall .sname{color:var(--paper);font-weight:900;font-size:clamp(12px,3vw,15px);margin-top:2px;}
  .stall .sprice{color:var(--lantern);font-weight:900;font-size:clamp(12px,3vw,15px);}
  .badge{display:inline-block;font-size:10px;font-weight:900;border-radius:8px;padding:1px 7px;color:#fff;margin-left:3px;vertical-align:2px;}
  .b-game{background:var(--pink);} .b-food{background:var(--midori);} .b-goods{background:var(--murasaki);}
  .map-bottom{display:flex;justify-content:center;gap:10px;padding:6px 0 10px;flex-shrink:0;}

  /* ====== おさいふバー ====== */
  .wallet-bar{
    background:var(--paper);border-radius:20px;padding:8px 10px;margin:0 6px;
    display:flex;align-items:center;gap:8px;flex-shrink:0;
    box-shadow:0 3px 0 rgba(0,0,0,.25);
  }
  .wallet-bar .wtitle{font-weight:900;font-size:13px;color:#8a5a2a;white-space:nowrap;}
  .wallet-coins{display:flex;gap:6px;flex:1;justify-content:space-around;}
  .wgroup{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;transition:transform .1s;}
  .wgroup:active{transform:scale(1.15);}
  .wgroup.empty{opacity:.25;pointer-events:none;}
  .wcount{font-weight:900;font-size:13px;}

  /* ====== やたい(かいもの) ====== */
  #scr-shop{padding:0 0 8px;}
  .shop-head{display:flex;align-items:center;gap:8px;padding:8px 12px 0;flex-shrink:0;}
  .shop-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:0;}
  .shop-item svg{max-height:18vh;}
  .price-tag{background:var(--paper);border-radius:16px;padding:6px 22px;font-size:24px;font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.25);}
  .price-tag small{font-size:14px;color:#8a5a2a;display:block;text-align:center;}
  .tray{
    background:rgba(255,255,255,.12);border:3px dashed rgba(255,246,232,.5);border-radius:20px;
    margin:8px 14px;min-height:74px;padding:8px;flex-shrink:0;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;position:relative;
  }
  .tray-label{position:absolute;top:-11px;left:16px;background:var(--night1);color:var(--lantern-glow);font-size:12px;font-weight:900;padding:0 8px;border-radius:8px;}
  .tray-coin{cursor:pointer;animation:pop .25s;}
  .tray-total{color:var(--paper);font-weight:900;font-size:18px;text-align:center;flex-shrink:0;}
  .tray-total b{color:var(--lantern);font-size:24px;}
  .shop-btns{display:flex;justify-content:center;gap:10px;padding:8px 0 4px;flex-shrink:0;}
  .hint-pop{color:var(--lantern-glow);font-size:14px;font-weight:900;text-align:center;min-height:20px;flex-shrink:0;}

  /* ====== おつり ====== */
  #scr-change{align-items:center;justify-content:center;gap:14px;padding:16px;}
  #change-coins{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:380px;}

  /* ====== ミニゲーム ====== */
  #scr-game{align-items:center;padding:8px;}
  #game-area{flex:1;width:100%;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;}
  .pool{width:min(92%,440px);aspect-ratio:1.5;background:radial-gradient(circle at 50% 40%,#7fd4ff,#3aa4dd);border-radius:50%/40%;position:relative;overflow:hidden;border:8px solid #e0e4ea;box-shadow:inset 0 6px 20px rgba(0,0,0,.2);}
  .floaty{position:absolute;cursor:pointer;transition:transform .1s;}
  .floaty:active{transform:scale(1.2);}
  .bob{animation:bob 2.2s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(6deg)}}
  .swim{animation:swim 5s linear infinite;}
  @keyframes swim{0%{left:105%}100%{left:-15%}}
  .caught-msg{color:var(--paper);font-weight:900;font-size:clamp(16px,4.5vw,22px);text-align:center;min-height:30px;flex-shrink:0;padding:0 8px;}
  .wiggle{animation:wiggle 1.6s ease-in-out infinite;transform-origin:bottom center;}
  @keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
  .shake{animation:shakex .4s;}
  @keyframes shakex{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .fall{transition:transform .6s ease-in, opacity .6s;transform:rotate(80deg) translateY(46px) !important;opacity:0;}
  .ghostfloat{animation:ghostf 3s ease-in-out infinite;}
  @keyframes ghostf{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
  #scr-game.spooky{background:radial-gradient(circle at 50% 30%, #2a1a4a, transparent 70%);}

  /* ====== おわり ====== */
  #scr-end{align-items:center;justify-content:flex-start;gap:10px;padding:12px;position:relative;overflow-y:auto;}
  #fireworks-canvas{position:fixed;inset:0;pointer-events:none;z-index:1;}
  .item-shelf{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;background:var(--paper);border-radius:20px;padding:12px 16px;max-width:440px;box-shadow:0 4px 0 rgba(0,0,0,.25);position:relative;z-index:2;}
  .item-shelf .none{font-weight:700;color:#8a7a68;}
  .end-money{color:var(--paper);font-weight:900;font-size:16px;text-align:center;position:relative;z-index:2;}
  .end-money b{color:var(--lantern);font-size:24px;}
  .verdict{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:20px;padding:10px 14px;max-width:440px;box-shadow:0 4px 0 rgba(0,0,0,.25);position:relative;z-index:2;}
  .verdict .vtext{font-weight:900;font-size:15px;line-height:1.5;}

  .toast{
    position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(0);
    background:var(--paper);border-radius:20px;padding:14px 26px;font-size:clamp(17px,4.5vw,22px);font-weight:900;
    box-shadow:0 6px 0 rgba(0,0,0,.3);z-index:50;pointer-events:none;text-align:center;max-width:88%;
  }
  .toast.show{animation:toastin 1.6s forwards;}
  @keyframes toastin{0%{transform:translate(-50%,-50%) scale(0)}15%{transform:translate(-50%,-50%) scale(1.05)}26%{transform:translate(-50%,-50%) scale(1)}82%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(.8);opacity:0}}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s !important;animation-iteration-count:1 !important;transition-duration:.001s !important;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="lanterns" id="lanterns"></div>
  <div id="statusbar">
    <div class="clock-wrap"><span id="clock-svg"></span>
      <div class="clock-digit"><span id="clock-text">5じ</span><small>やくそくは 7じ</small></div>
    </div>
    <div class="meter"><span class="mface" id="mface">😊</span>
      <div><div class="mbar"><div id="mbarfill" style="width:70%;background:#57b98b"></div></div><div class="mlabel">おなか</div></div>
    </div>
  </div>

  <!-- タイトル -->
  <div class="screen active" id="scr-title">
    <canvas class="title-fireworks" id="title-fw"></canvas>
    <h1><span class="fude">こどもの</span>なつまつり<br>ごっこ</h1>
    <div id="title-avatar" style="height:28vh;"></div>
    <button class="btn btn-big" onclick="startDress()">あそぶ！</button>
  </div>

  <!-- きせかえ -->
  <div class="screen" id="scr-dress">
    <h2>ゆかたに きがえよう</h2>
    <div id="dress-stage"></div>
    <div class="picker-area">
      <div class="picker-tabs" id="ptabs"></div>
      <div class="swatches" id="swatches"></div>
      <div class="dress-go"><button class="btn btn-big btn-pink" onclick="startMoney()">できた！つぎへ →</button></div>
    </div>
  </div>

  <!-- おこづかい&やくそく -->
  <div class="screen" id="scr-money">
    <h2>おでかけのまえに…</h2>
    <div class="mom-row"><span id="mom-face1"></span>
      <div class="money-bubble">「よるの <b style="color:var(--aka)">7じ</b> までには かえってきてね。<br>とけいの <span style="color:var(--aka)">あかいしるし</span> のところだよ。<br><b>やくそくだよ！</b>」</div>
    </div>
    <div class="money-bubble">おこづかいは <b style="color:var(--aka)">1500えん</b>！<br>コインを ぜんぶタッチして おさいふへ</div>
    <div id="gift-coins"></div>
    <div class="wallet-bar" style="width:100%;max-width:440px"><span class="wtitle">おさいふ</span><div class="wallet-coins" id="wallet-money"></div></div>
    <div style="padding:6px 0 14px;">
      <button class="btn btn-big btn-green" id="money-go" disabled onclick="startFestival()">おまつりへ しゅっぱつ！</button>
    </div>
  </div>

  <!-- マップ -->
  <div class="screen" id="scr-map">
    <h2>どのおみせに いく？</h2>
    <div class="map-grid" id="map-grid"></div>
    <div class="wallet-bar"><span class="wtitle">おさいふ</span><div class="wallet-coins" id="wallet-map"></div></div>
    <div class="map-bottom">
      <button class="btn btn-ghost" id="home-btn" onclick="goHome(false)">🏠 おうちに かえる</button>
    </div>
  </div>

  <!-- やたい -->
  <div class="screen" id="scr-shop">
    <div class="shop-head">
      <button class="btn btn-ghost" onclick="cancelShop()">← もどる</button>
      <h2 style="flex:1" id="shop-title"></h2>
      <div style="width:70px"></div>
    </div>
    <div class="shop-item" id="shop-item-art"></div>
    <div class="tray" id="tray"><span class="tray-label">ここに おかねを だしてね</span></div>
    <div class="tray-total" id="tray-total"></div>
    <div class="hint-pop" id="hint-pop"></div>
    <div class="shop-btns">
      <button class="btn btn-ghost" onclick="showHint()">ヒント</button>
      <button class="btn btn-big btn-green" id="pay-btn" disabled onclick="doPay()">はらう！</button>
    </div>
    <div class="wallet-bar" style="margin-bottom:8px;"><span class="wtitle">おさいふ<br><small style="font-weight:700;color:#b08a5a">タッチしてだす</small></span><div class="wallet-coins" id="wallet-shop"></div></div>
  </div>

  <!-- おつり -->
  <div class="screen" id="scr-change">
    <h2 id="change-title">おつりを もらったよ</h2>
    <div class="money-bubble" id="change-msg"></div>
    <div id="change-coins"></div>
    <div class="wallet-bar" style="width:calc(100% - 12px)"><span class="wtitle">おさいふ</span><div class="wallet-coins" id="wallet-change"></div></div>
  </div>

  <!-- ミニゲーム -->
  <div class="screen" id="scr-game">
    <h2 id="game-title"></h2>
    <div class="caught-msg" id="game-msg"></div>
    <div id="game-area"></div>
    <div style="padding:8px 0 14px;flex-shrink:0;"><button class="btn btn-big" id="game-done" style="display:none" onclick="finishActivity()">やったね！マップへ</button></div>
  </div>

  <!-- おわり -->
  <div class="screen" id="scr-end">
    <canvas id="fireworks-canvas"></canvas>
    <h2 id="end-title">たのしかったね！</h2>
    <div class="verdict" id="verdict"></div>
    <div class="sub">きょうの おみやげ・たべたもの</div>
    <div class="item-shelf" id="item-shelf"></div>
    <div class="end-money" id="end-money"></div>
    <div id="end-avatar" style="height:20vh;position:relative;z-index:2;flex-shrink:0;"></div>
    <button class="btn btn-big" style="position:relative;z-index:2;flex-shrink:0;margin-bottom:10px;" onclick="location.reload()">もういちど あそぶ</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
/* ================= 状態 ================= */
const S = {
  yukata:{gender:'girl', base:0, pattern:0, obi:0, hair:0},
  mask:null,
  wallet:{500:0,100:0,50:0,10:0},
  tray:{500:0,100:0,50:0,10:0},
  items:[],
  bought:{},
  currentStall:null,
  time:0,          // 17:00からの経過(分)
  hunger:70,       // 0-100
  started:false,
  warned90:false, warned110:false, ended:false,
};
const PROMISE=120, HARD=150;   // 19:00 / 19:30
const GIFT=[{v:500,n:2},{v:100,n:4},{v:50,n:1},{v:10,n:5}]; // =1500えん
const DENOMS=[500,100,50,10];
const BASES=['#e85345','#4a7fd4','#ffb0c9','#57b98b'];
const OBIS=['#f5c542','#8a5ad4','#ff8a5a','#3aa4dd'];
const PATTERNS=['asagao','kingyo','hanabi','none'];
const HAIRS_G=['twin','bob','odango'];
const HAIRS_B=['short','spiky','mage'];

/* ================= サウンド ================= */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f,d,t=0,type='sine',v=.15){
  const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(v,c.currentTime+t);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+d);
  o.connect(g).connect(c.destination);
  o.start(c.currentTime+t); o.stop(c.currentTime+t+d);
}
const sCoin=()=>{tone(1200,.12,0,'triangle');tone(1600,.15,.05,'triangle');};
const sTap=()=>tone(600,.08,0,'sine',.1);
const sPay=()=>{tone(880,.1);tone(1174,.12,.09);tone(1568,.2,.18);};
const playJingle=()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.18,i*.11,'triangle'));};
const sYay=()=>{[784,988,1175,1568].forEach((f,i)=>tone(f,.15,i*.09,'square',.08));};
const sBuzz=()=>tone(160,.25,0,'sawtooth',.1);
const sSpooky=()=>{[220,180,150].forEach((f,i)=>tone(f,.3,i*.15,'triangle',.1));};
const sCrash=()=>{tone(120,.3,0,'sawtooth',.15);tone(90,.35,.05,'sawtooth',.12);};

/* ================= コインSVG ================= */
function coinSVG(v,size=48){
  const col={500:'var(--coin-500)',100:'var(--coin-100)',50:'var(--coin-50)',10:'var(--coin-10)'}[v];
  const dark={500:'#a3924a',100:'#9aa0aa',50:'#a6adb8',10:'#8a5530'}[v];
  const hole=v===50?`<circle cx="30" cy="30" r="7" fill="var(--night2)" opacity=".85"/>`:'';
  const fs=v===50?13:(v===500?16:15);
  const ty=v===50?50:36;
  return `<svg width="${size}" height="${size}" viewBox="0 0 60 60">
    <circle cx="30" cy="32" r="27" fill="${dark}"/><circle cx="30" cy="29" r="27" fill="${col}"/>
    <circle cx="30" cy="29" r="21" fill="none" stroke="${dark}" stroke-width="2" opacity=".6"/>
    ${hole}<text x="30" y="${ty}" text-anchor="middle" font-size="${fs}" font-weight="900" fill="${dark}" font-family="inherit">${v}</text>
  </svg>`;
}

function patternDefs(id,base){
  const p=PATTERNS[S.yukata.pattern];
  if(p==='none') return {defs:'',fill:base};
  let inner='';
  if(p==='asagao') inner=`<circle cx="12" cy="12" r="6" fill="#fff" opacity=".9"/><circle cx="12" cy="12" r="2.5" fill="${OBIS[S.yukata.obi]}"/>`;
  if(p==='kingyo') inner=`<path d="M6 12 q5 -6 10 0 q-5 6 -10 0 M16 12 l4 -3 v6 z" fill="#fff" opacity=".9"/>`;
  if(p==='hanabi') inner=`<g stroke="#ffe9a8" stroke-width="1.6" opacity=".95"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/><line x1="7" y1="7" x2="17" y2="17"/><line x1="17" y1="7" x2="7" y2="17"/></g>`;
  return {defs:`<pattern id="${id}" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="${base}"/>${inner}</pattern>`,fill:`url(#${id})`};
}

/* ================= とけい ================= */
function nowHM(){ return {h:5+Math.floor(S.time/60), m:S.time%60}; }
function clockSVG(size=42){
  const {h,m}=nowHM();
  const ha=((h%12)+m/60)*30, ma=m*6;
  let ticks='';
  for(let i=0;i<12;i++){
    const a=i*30*Math.PI/180;
    const big=i%3===0;
    ticks+=`<line x1="${22+Math.sin(a)*(big?15:17)}" y1="${22-Math.cos(a)*(big?15:17)}" x2="${22+Math.sin(a)*19}" y2="${22-Math.cos(a)*19}" stroke="#8a5a2a" stroke-width="${big?2:1}"/>`;
  }
  const pa=7*30*Math.PI/180; // 7じのやくそくマーク
  return `<svg width="${size}" height="${size}" viewBox="0 0 44 44">
    <circle cx="22" cy="22" r="21" fill="#fff" stroke="#8a5a2a" stroke-width="2.5"/>
    ${ticks}
    <circle cx="${22+Math.sin(pa)*13}" cy="${22-Math.cos(pa)*13}" r="3" fill="var(--aka)"/>
    <line x1="22" y1="22" x2="${22+Math.sin(ha*Math.PI/180)*9}" y2="${22-Math.cos(ha*Math.PI/180)*9}" stroke="#3a2c26" stroke-width="3.4" stroke-linecap="round"/>
    <line x1="22" y1="22" x2="${22+Math.sin(ma*Math.PI/180)*14}" y2="${22-Math.cos(ma*Math.PI/180)*14}" stroke="var(--aka)" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="22" cy="22" r="2.2" fill="#3a2c26"/>
  </svg>`;
}
function timeText(){ const {h,m}=nowHM(); return `${h}じ${m?`${m}ぷん`:''}`; }
function updateStatus(){
  if(!S.started) return;
  document.getElementById('clock-svg').innerHTML=clockSVG();
  document.getElementById('clock-text').textContent=timeText();
  const v=S.hunger;
  document.getElementById('mface').textContent = v>=60?'😊':v>=30?'😯':'😫';
  const f=document.getElementById('mbarfill');
  f.style.width=Math.max(v,4)+'%';
  f.style.background = v>=60?'#57b98b':v>=30?'#f5c542':'#e85345';
  const hb=document.getElementById('home-btn');
  if(S.time>=90) hb.classList.add('urgent');
}
function advanceTime(min){
  const prev=S.time;
  S.time+=min;
  updateStatus();
  if(S.time>=HARD && !S.ended){ setTimeout(()=>goHome(true),1600); toast(`よるの 7じはん…！！<br>おかあさんが むかえにきた！💢`); sBuzz(); return; }
  if(prev<PROMISE && S.time>=PROMISE){ toast(`⏰ 7じに なっちゃった！<br>いそいで かえろう！`); sBuzz(); return; }
  if(prev<110 && S.time>=110 && !S.warned110){ S.warned110=true; toast(`🕐 もうすぐ 7じ！<br>そろそろ かえろうね`); return; }
  if(prev<90 && S.time>=90 && !S.warned90){ S.warned90=true; toast(`🕡 6じはんだよ。<br>とけいの はりを みてみて！`); }
}
function changeHunger(d){
  S.hunger=Math.max(0,Math.min(100,S.hunger+d));
  updateStatus();
}

/* ================= かいもの ================= */
function openShop(id){
  sTap();
  const st=STALLS.find(s=>s.id===id);
  if(S.bought[id] && st.type!=='food'){ toast('きょうは もう あそんだよ！<br>ほかのおみせに いこう'); return; }
  if(st.type==='game' && S.hunger<20){ toast('おなかが ぺこぺこで ちからがでない〜！<br>🍌 なにか たべよう'); sBuzz(); return; }
  if(walletTotal()<st.price){ toast('おかねが たりないみたい…'); return; }
  S.currentStall=st;
  S.tray={500:0,100:0,50:0,10:0};
  showScreen('scr-shop');
  document.getElementById('shop-title').textContent=st.name;
  document.getElementById('shop-item-art').innerHTML=
    stallArt(st.id,150)+`<div class="price-tag">${st.price}<small>えん ください</small></div>`;
  document.getElementById('hint-pop').textContent='';
  renderShop();
}
function renderShop(){
  renderWallet('wallet-shop',true);
  const tray=document.getElementById('tray');
  let html='<span class="tray-label">ここに おかねを だしてね</span>';
  DENOMS.forEach(v=>{ for(let i=0;i<S.tray[v];i++) html+=`<div class="tray-coin" onclick="coinBack(${v})">${coinSVG(v,44)}</div>`; });
  tray.innerHTML=html;
  const t=trayTotal(), p=S.currentStall.price;
  document.getElementById('tray-total').innerHTML= t>0 ? `だしたおかね <b>${t}</b> えん` : `<span style="opacity:.7">まだ 0 えん</span>`;
  const btn=document.getElementById('pay-btn');
  btn.disabled=t<p;
  btn.textContent = t>=p ? (t===p?'ぴったり！はらう':'はらう！') : 'はらう！';
}
function coinToTray(v){ if(S.wallet[v]<=0)return; S.wallet[v]--; S.tray[v]++; sCoin(); renderShop(); }
function coinBack(v){ S.tray[v]--; S.wallet[v]++; sTap(); renderShop(); }
function cancelShop(){
  DENOMS.forEach(v=>{S.wallet[v]+=S.tray[v];S.tray[v]=0;});
  sTap(); showScreen('scr-map');
}
function showHint(){
  sTap();
  const p=S.currentStall.price;
  let rest=p, combo=[];
  const avail={...S.wallet}; DENOMS.forEach(v=>avail[v]+=S.tray[v]);
  for(const v of DENOMS){ while(rest>=v && avail[v]>0){ rest-=v; avail[v]--; combo.push(v);} }
  let msg;
  if(rest===0){
    const cnt={}; combo.forEach(v=>cnt[v]=(cnt[v]||0)+1);
    msg='ぴったりは… '+DENOMS.filter(v=>cnt[v]).map(v=>`${v}えんだま×${cnt[v]}`).join(' と ');
  }else{
    msg='おおきい コインで はらうと おつりが もらえるよ';
  }
  document.getElementById('hint-pop').textContent=msg;
}
function doPay(){
  sPay();
  const t=trayTotal(), p=S.currentStall.price, change=t-p;
  S.tray={500:0,100:0,50:0,10:0};
  if(change===0){ toast('ぴったり！すごい！ 💮',()=>startGame()); }
  else{ showChange(change); }
}

let changeLeft=0;

  showScreen('scr-change');
  document.getElementById('change-msg').innerHTML=`おつりは <b style="color:var(--aka);font-size:22px">${change}えん</b><br>コインを タッチして おさいふへ！`;
  const coins=[]; let r=change;
  for(const v of [100,50,10]){ while(r>=v){ r-=v; coins.push(v);} }
  changeLeft=coins.length;
  document.getElementById('change-coins').innerHTML=coins.map((v,i)=>
    `<div class="gift-coin" style="animation-delay:${i*.08}s" onclick="takeChange(this,${v})">${coinSVG(v,52)}</div>`).join('');
  renderWallet('wallet-change',false);
}
function takeChange(el,v){
  S.wallet[v]++; el.remove(); sCoin(); changeLeft--;
  renderWallet('wallet-change',false);
  if(changeLeft===0) setTimeout(startGame,400);
}

const HIRAGANA=['あ','い','う','え','お','か','き','く','け','こ','さ','し','す','せ','そ','た','ち','つ','て','と','な','に','ぬ','ね','の','は','ひ','ふ','へ','ほ','ま','み','む','め','も'];
function setMsg(m){ document.getElementById('game-msg').innerHTML=m; }
function gameDone(){ document.getElementById('game-done').style.display='inline-block'; }
function startGame(){
  const st=S.currentStall;
  showScreen('scr-game');
  document.getElementById('game-title').textContent=st.name;
  setMsg(''); document.getElementById('game-done').style.display='none';
  const area=document.getElementById('game-area');
  area.innerHTML='';

  if(st.id==='yoyo'){
    setMsg('すきな ヨーヨーを タッチ！');
    const cols=['#ff5a7a','#f5c542','#57b98b','#8a5ad4'];
    area.innerHTML=`<div class="pool">${cols.map((c,i)=>
      `<div class="floaty bob" style="left:${8+i*23}%;top:${28+(i%2)*24}%;animation-delay:${i*.4}s" onclick="winSimple(this,'とれた！')">

      </div>`).join('')}</div>`;
  }

  if(st.id==='kingyo'){
    let need=2;
    window._kingyoTap=(el)=>{
      el.remove(); sYay(); need--;
      setMsg(need>0?`とれた！あと ${need}ひき！`:'きんぎょ 2ひき ゲット！');
      if(need===0) gameDone();
    };
    setMsg('きんぎょを 2ひき タッチしてね！');
    const fish=['#ff5a3a','#ffb03a','#ff5a3a','#3a3a3a'];
    area.innerHTML=`<div class="pool">${fish.map((c,i)=>
      `<div class="floaty swim" style="top:${16+i*20}%;animation-duration:${4+i*1.3}s;animation-delay:${-i*1.7}s" onclick="_kingyoTap(this)">
        <svg width="56" height="34" viewBox="0 0 56 34"><path d="M8 17 q14 -15 28 0 q-14 15 -28 0" fill="${c}"/><path d="M36 17 l14 -9 v18 z" fill="${c}"/><path d="M18 8 q4 -6 8 0 z" fill="${c}"/><circle cx="15" cy="14" r="3.2" fill="#fff"/><circle cx="15" cy="14" r="1.6" fill="#3a2c26"/><circle cx="12" cy="19" r="1.8" fill="#ffb0a0" opacity=".85"/></svg>
      </div>`).join('')}</div>`;
  }

  if(st.id==='shateki'){
    let shots=3, hit=0;
    window._shot=(el,name)=>{
      if(el.classList.contains('fall'))return;

function pinHTML(){

    <path d="M15 2 q7 8 1 19 q-3 9 5 16 q3 5 -6 13 q-9 -8 -6 -13 q8 -7 5 -16 q-6 -11 1 -19 z" fill="#fff" stroke="#ddd"/>
    <rect x="7" y="14" width="16" height="4" rx="2" fill="#e85345"/>
  </svg>`;
}
function winSimple(el,msg){
  el.classList.remove('bob');
  el.style.pointerEvents='none'; el.style.transform='scale(1.3)';
  sYay(); setMsg(msg); gameDone();
}
function finishActivity(){
  const st=S.currentStall;
  if(st.type!=='food') S.bought[st.id]=true;
  playJingle();
  if(st.type==='food'){
    changeHunger(st.feed);
    S.items.push({id:st.id, itemName:st.name});
    advanceTime(10);
    if(S.time>=HARD) return;
    toast(`おなかが みたされた〜！<br>🍴 +${st.feed}`,()=>{ if(!S.ended) showScreen('scr-map'); });
  }else if(st.type==='goods'){
    S.items.push({id:'omen', itemName:'おめん'});
    advanceTime(10);
    if(S.time>=HARD) return;
    toast('おめん ゲット！',()=>{ if(!S.ended) showScreen('scr-map'); });
  }else{
    changeHunger(-20);
    S.items.push({id:st.id, itemName:st.itemName});
    advanceTime(20);
    if(S.time>=HARD) return;
    const hungry=S.hunger<30?'<br><small>おなかが すいてきた…🍌</small>':'';
    toast(`${st.itemName} ゲット！${hungry}`,()=>{ if(!S.ended) showScreen('scr-map'); });
  }
}

/* ================= おわり&はなび ================= */
function goHome(forced){
  if(S.ended)return;
  S.ended=true;
  showScreen('scr-end');
  document.getElementById('statusbar').classList.add('show');
  updateStatus();
  const t=S.time;
  let mood,text,title,doFw=true;
  if(forced){
    mood='angry'; doFw=false;
    title='おかあさんが おむかえに…';
    text=`「もう <b>7じはん</b>！！しんぱいしたんだから！💢💢<br>やくそくは <b>7じ</b> だったでしょ〜！」<br><small>…でも、たのしかったなら よかった(ぼそっ)</small>`;
  }else if(t<110){
    mood='happy';
    title='たのしかったね！';
    text=`「<b>${timeText()}</b> に かえってきたのね！<br>やくそくの 7じより <b style="color:var(--midori)">まえ</b> に かえれて えらい！💮<br>とけいが よめるなんて すごいね！」`;
  }else if(t<PROMISE){
    mood='happy';
    title='ぎりぎりセーフ！';
    text=`「<b>${timeText()}</b>！ぎりぎり セーフ〜！<br>つぎは もうすこし はやく かえろうね😊」`;
  }else{
    mood='angry'; doFw=false;
    title='あ〜あ、おこられた…';
    text=`「いま <b>${timeText()}</b> よ！やくそくは <b>7じ</b> でしょ！💢<br>とけいの あかいしるし、みてなかったな〜？」<br><small>ごめんなさいして、つぎは まもろうね</small>`;
  }
  document.getElementById('end-title').textContent=title;
  document.getElementById('verdict').innerHTML=`<div>${momSVG(mood,80)}</div><div class="vtext">${text}</div>`;
  const shelf=document.getElementById('item-shelf');
  shelf.innerHTML=S.items.length
    ? S.items.map(it=>`<div style="text-align:center">${itemIcon(it.id,50)}<div style="font-size:11px;font-weight:900">${it.itemName}</div></div>`).join('')
    : '<span class="none">こんどは なにか かってみようね</span>';
  document.getElementById('end-money').innerHTML=`のこったおかね <b>${walletTotal()}えん</b><br><small>また こんど つかおうね</small>`;
  document.getElementById('end-avatar').innerHTML=avatarSVG('end');
  if(doFw){ playJingle(); fireworks(document.getElementById('fireworks-canvas'),true); }
  else sBuzz();
}

function fireworks(canvas,loop){
  const ctx=canvas.getContext('2d');
  const resize=()=>{canvas.width=canvas.offsetWidth||innerWidth;canvas.height=canvas.offsetHeight||innerHeight;};
  resize(); window.addEventListener('resize',resize);
  let parts=[];
  const cols=['#ffd98a','#ff7bac','#7fd4ff','#a8f0c0','#ff8a5a'];
  function burst(){
    const x=canvas.width*(0.15+Math.random()*0.7), y=canvas.height*(0.1+Math.random()*0.4);
    const c=cols[Math.floor(Math.random()*cols.length)];
    for(let i=0;i<26;i++){
      const a=(i/26)*Math.PI*2, sp=1.2+Math.random()*1.6;
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,c});
    }
  }
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    parts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=.02; p.l-=.014;
      ctx.globalAlpha=Math.max(p.l,0); ctx.fillStyle=p.c;
      ctx.beginPath(); ctx.arc(p.x,p.y,2.4,0,7); ctx.fill();
    });
    ctx.globalAlpha=1;
    parts=parts.filter(p=>p.l>0);
    requestAnimationFrame(tick);
  }
  tick(); burst(); setTimeout(burst,500);
  if(loop) setInterval(burst,1500);
}
fireworks(document.getElementById('title-fw'),true);
